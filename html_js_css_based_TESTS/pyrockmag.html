// ── UI init ──────────────────────────────────────────────────────────────────
function renderOps() {
  const list = document.getElementById('op-list'); list.innerHTML = '';
  for (const grp of OPS) {
    const h = document.createElement('div'); h.className='shdr'; h.textContent=grp.sec; list.appendChild(h);
    for (const op of grp.items) {
      const el = document.createElement('div');
      el.className = 'op' + (op.key===S.activeOp ? ' active' : '');
      el.innerHTML = `<span class="op-key">${op.key}</span><span class="op-desc">${op.desc}</span>`;
      el.onclick = () => { S.activeOp=op.key; renderOps(); };
      list.appendChild(el);
    }
  }
}

function preset(n) {
  S.activeOp = n==='core' ? 'IRM' : n==='all' ? 'DASHBOARD' : null;
  renderOps();
}

// ── File loading ─────────────────────────────────────────────────────────────
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('over');
  onFiles(e.dataTransfer.files);
}

async function onFiles(files) {
  if (!S.py) { log('Python not ready yet — please wait','warn'); return; }
  const newFiles = Array.from(files).filter(f =>
    /\.(rmg|frc|cor)$/i.test(f.name) &&
    !S.samples.find(s => s.name === f.name.replace(/\.[^.]+$/,'').replace(/\.(frc|cor)$/i,''))
  );
  if (!newFiles.length) { log('no new supported files','warn'); return; }
  spinner(true, `loading ${newFiles.length} file(s)…`);
  let ok=0, err=0;
  for (const f of newFiles) {
    try {
      const text = await f.text();
      // write to Pyodide virtual FS then parse
      S.py.FS.writeFile('/tmp/' + f.name, text);
      const d = S.py.globals.get('rmg_import')('/tmp/' + f.name);
      S.samples.push({
        name: d.samplename,
        steps: d.steptypes.length,
        mass_g: isFinite(d.mass * 1000) ? (d.mass * 1000).toFixed(4) : null,
        _d: d,
      });
      ok++;
    } catch(ex) { err++; console.error(f.name, ex); }
  }
  spinner(false);
  renderSamples();
  const msg = err ? `loaded ${ok}, ${err} error(s)` : `loaded ${ok} file(s)`;
  log(msg, err ? 'warn' : 'ok');
  document.getElementById('run-btn').disabled = false;
}

function removeSelected() {
  S.samples = S.samples.filter(s => !S.selected.has(s.name));
  S.selected.clear(); renderSamples();
}
function clearAll() { S.samples=[]; S.selected.clear(); renderSamples(); }
function selAll()  { S.samples.forEach(s=>S.selected.add(s.name)); renderSamples(); }
function selNone() { S.selected.clear(); renderSamples(); }
function toggleSample(n) { S.selected.has(n)?S.selected.delete(n):S.selected.add(n); renderSamples(); }
function getSelected() {
  return S.selected.size
    ? S.samples.filter(s=>S.selected.has(s.name))
    : S.samples;
}

function renderSamples() {
  const list = document.getElementById('sample-list'); list.innerHTML='';
  for (const s of S.samples) {
    const chk = S.selected.has(s.name);
    const el = document.createElement('div'); el.className='si'+(chk?' sel':'');
    const meta = [s.steps?s.steps+' steps':'', s.mass_g?s.mass_g+'g':''].filter(Boolean).join(' · ');
    el.innerHTML = `<input type="checkbox" class="si-chk" ${chk?'checked':''}><span class="si-name" title="${s.name}">${s.name}</span>${meta?`<span class="si-meta">${meta}</span>`:''}`;
    el.querySelector('input').onchange = () => toggleSample(s.name);
    el.onclick = e => { if(e.target.tagName!=='INPUT') toggleSample(s.name); };
    list.appendChild(el);
  }
  const n=S.samples.length, sel=S.selected.size;
  document.getElementById('cbar').textContent = `${n} sample${n!==1?'s':''} loaded${sel?` · ${sel} selected`:''}`;
}

// ── Run ───────────────────────────────────────────────────────────────────────
async function runAnalysis() {
  const sel = getSelected();
  if (!sel.length) { log('no samples selected','warn'); return; }
  if (!S.activeOp) { log('select an operation','warn'); return; }
  const op = S.activeOp;

  document.getElementById('run-btn').disabled=true;
  log(`${op} · ${sel.length} sample(s)…`,''); setStatus('running'); spinner(true,`computing ${op}…`);
  hideAll();

  try {
    const samples = sel.map(s=>s._d);
    if (op==='STATS')      await runStats(samples);
    else if (op==='COER')  await runCoer(samples);
    else if (op==='CSV')   { doCSV(samples); log('CSV downloaded','ok'); }
    else if (op==='DASHBOARD') await runDashboard(samples);
    else                   await runPlot(samples, op);
  } catch(e) { log(e.message || String(e), 'err'); console.error(e); }

  spinner(false);
  document.getElementById('run-btn').disabled=false;
  setStatus('idle');
}

// ── Python → JS bridge helpers ───────────────────────────────────────────────
function pyArr(a) {
  try { const js = a.toJs(); a.destroy && a.destroy(); return Array.from(js).map(v=>isFinite(v)?v:null); }
  catch(_) { return []; }
}

function safeFloat(v) {
  if (v===null||v===undefined) return null;
  const f = parseFloat(v);
  return isFinite(f) ? f : null;
}

function callPy(fn, ...args) {
  return S.py.globals.get(fn)(...args);
}

// ── Plotly dark layout helper ────────────────────────────────────────────────
function mkLayout(title, xlab, ylab, extras={}) {
  const isLight = document.documentElement.classList.contains('light');
  const tx  = isLight ? '#1a1208' : '#e0e8e6';
  const tx2 = isLight ? '#4a3820' : '#8fa8a4';
  const bg  = isLight ? '#f5f2ed' : '#0a0e0f';
  const grid= isLight ? '#ddd5c8' : '#1e2a2c';
  const line= isLight ? '#c8bfb2' : '#2a3235';
  const ax  = {gridcolor:grid,linecolor:line,tickcolor:line,zerolinecolor:line};
  return Object.assign({
    title:{text:title,font:{color:tx,size:13}},
    xaxis:Object.assign({},ax,{title:xlab}),
    yaxis:Object.assign({},ax,{title:ylab}),
    plot_bgcolor:bg, paper_bgcolor:bg,
    font:{family:"'IBM Plex Mono',monospace",color:tx,size:10},
    legend:{bgcolor:'rgba(0,0,0,0)',font:{color:tx2,size:9}},
    margin:{l:54,r:16,t:40,b:48},
    hovermode:'closest',
  }, extras);
}

const LOG_TICKS = {tickvals:[5,10,50,100,500,1000],ticktext:['5','10','50','100','500','1000'],type:'log'};
const CFG = {responsive:true,displayModeBar:true,displaylogo:false,modeBarButtonsToRemove:['select2d','lasso2d']};
const CFG_SMALL = {responsive:true,displayModeBar:false,displaylogo:false};

// ── Individual plot builders ─────────────────────────────────────────────────
async function runPlot(samples, op) {
  const traces = buildTraces(samples, op);
  const layout = buildLayout(samples, op);
  if (!traces.length) { log(`no ${op} data in these samples`,'warn'); return; }
  const div = document.getElementById('plotly-div');
  div.className='vis';
  document.getElementById('pempty').style.display='none';
  Plotly.react(div, traces, layout, CFG);
  document.getElementById('ptitle').textContent = `${op} — ${samples.length===1?samples[0].samplename:samples.length+' samples'}`;
  log(`${op} rendered`,'ok');
  S.lastPlot = {traces, layout, op};
}

async function runDashboard(samples) {
  const PANELS = ['IRM','DIRM','ARM','LF','LF_ARM','FULLER','BACKFIELD','COERCIVITY'];
  const grid = document.getElementById('dash-grid');
  grid.className='vis';
  document.getElementById('pempty').style.display='none';
  for (let i=0; i<PANELS.length; i++) {
    const pt = PANELS[i];
    const traces = buildTraces(samples, pt);
    const layout = Object.assign(buildLayout(samples, pt), {margin:{l:42,r:8,t:28,b:36}});
    Plotly.react(document.getElementById('d'+i), traces, layout, CFG_SMALL);
  }
  document.getElementById('ptitle').textContent = `8-panel — ${samples.length===1?samples[0].samplename:samples.length+' samples'}`;
  log('dashboard rendered','ok');
  S.dashVis = true;
}

// ── Master trace dispatcher ──────────────────────────────────────────────────
function buildTraces(samples, op) {
  switch(op.toUpperCase()) {
    case 'IRM':        return tIRM(samples);
    case 'DIRM':       return tDIRM(samples);
    case 'ARM':        return tARM(samples);
    case 'LF':         return tLF(samples, false);
    case 'LF_ARM':     return tLF(samples, true);
    case 'FULLER':     return tFuller(samples);
    case 'BACKFIELD':  return tBackfield(samples);
    case 'COERCIVITY': return tCoercivity(samples);
    default: return [];
  }
}

function buildLayout(samples, op) {
  const n = samples.length===1 ? `: ${samples[0].samplename}` : '';
  switch(op.toUpperCase()) {
    case 'IRM':        return mkLayout(`IRM${n}`,'B (mT)','f<sub>SIRM</sub>',{xaxis:Object.assign(mkLayout('','','').xaxis,LOG_TICKS)});
    case 'DIRM':       return mkLayout(`dIRM/dB${n}`,'B (mT)','dIRM/d(log B)',{xaxis:Object.assign(mkLayout('','','').xaxis,LOG_TICKS),yaxis:Object.assign(mkLayout('','','').yaxis,{rangemode:'tozero'})});
    case 'ARM':        return mkLayout(`ARM${n}`,'B<sub>DC</sub> (mT)','fIRM100',{xaxis:Object.assign(mkLayout('','','').xaxis,{range:[0,1]}),yaxis:Object.assign(mkLayout('','','').yaxis,{range:[0,1]})});
    case 'LF':         return mkLayout(`Lowrie-Fuller${n}`,'B (mT)','Fractional mag.',{yaxis:Object.assign(mkLayout('','','').yaxis,{rangemode:'tozero'})});
    case 'LF_ARM':     return mkLayout(`LF-ARM${n}`,'B (mT)','Fractional mag.',{yaxis:Object.assign(mkLayout('','','').yaxis,{rangemode:'tozero'})});
    case 'FULLER':     return mkLayout(`Fuller${n}`,'IRM (Am²)','m (Am²)',{xaxis:Object.assign(mkLayout('','','').xaxis,{type:'log'}),yaxis:Object.assign(mkLayout('','','').yaxis,{type:'log'})});
    case 'BACKFIELD':  return mkLayout(`Backfield${n}`,'−B (mT)','Am²/kg');
    case 'COERCIVITY': return mkLayout('Coercivity comparison','Sample','mT',{barmode:'group'});
    default: return mkLayout(op,'','');
  }
}

// ── Trace builders ───────────────────────────────────────────────────────────
function tIRM(samples) {
  const tr = [];
  samples.forEach((d, i) => {
    try {
      const curves = callPy('rmg_sirm_curve', d._d || d);
      let best = null;
      for (let j=0; j<curves.length; j++) {
        const c = curves.get(j);
        if (c.doesExist && c.AF.doesExist) { best=c; break; }
        if (c.doesExist && !best) best=c;
      }
      if (!best || !best.doesExist) return;
      const dc = pyArr(best.IRM.treatmentDCFields).map(v=>v*1000);
      const fr = pyArr(best.IRM.fracmags);
      const pos = dc.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
      if (pos.length>1) tr.push({x:pos.map(i=>dc[i]),y:pos.map(i=>fr[i]),mode:'lines+markers',name:`${d.samplename || d._d?.samplename} acq`,line:{color:col(i),width:2},marker:{size:5,color:col(i)},type:'scatter'});
      if (best.AF.doesExist) {
        try {
          const afF = pyArr(best.AF.treatmentAFFields).map(v=>v*1000);
          const afFr = pyArr(best.AF.fracmags);
          const afPos = afF.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
          if (afPos.length>1) tr.push({x:afPos.map(i=>afF[i]),y:afPos.map(i=>afFr[i]),mode:'lines+markers',name:`${d.samplename || d._d?.samplename} AF`,line:{color:col(i),width:2,dash:'dot'},marker:{size:4,color:col(i)},type:'scatter'});
        } catch(_){}
      }
    } catch(e){ console.warn('IRM',d.name,e); }
  });
  return tr;
}

function tDIRM(samples) {
  const tr=[];
  const IC=['#16a34a','#2563eb','#dc2626'], AC=['#ca8a04','#0891b2','#9333ea'];
  samples.forEach((d,i) => {
    try {
      const curves = callPy('rmg_sirm_curve', d._d || d);
      let best=null;
      for(let j=0;j<curves.length;j++){const c=curves.get(j);if(c.doesExist&&c.AF.doesExist){best=c;break;}if(c.doesExist&&!best)best=c;}
      if(!best||!best.doesExist) return;
      const ci=i%3;
      if(best.IRM.logDerivFields) {
        const x=pyArr(best.IRM.logDerivFields).map(v=>Math.pow(10,v+3));
        const y=pyArr(best.IRM.logderivSmooth);
        const fin=x.map((_,k)=>y[k]!=null&&isFinite(y[k]));
        const fx=x.filter((_,k)=>fin[k]), fy=y.filter((_,k)=>fin[k]);
        if(fx.length>1) tr.push({x:fx,y:fy,mode:'lines+markers',name:`${d.samplename} Acq`,line:{color:IC[ci],width:2},marker:{size:5,color:IC[ci]},type:'scatter'});
      }
      if(best.AF.doesExist&&best.AF.logDerivFields) {
        try {
          const x=pyArr(best.AF.logDerivFields).map(v=>Math.pow(10,v+3));
          const y=pyArr(best.AF.logderivSmooth);
          const fin=x.map((_,k)=>y[k]!=null&&isFinite(y[k]));
          const fx=x.filter((_,k)=>fin[k]), fy=y.filter((_,k)=>fin[k]);
          if(fx.length>1) tr.push({x:fx,y:fy,mode:'lines+markers',name:`${d.samplename} AF`,line:{color:AC[ci],width:2},marker:{size:4,color:AC[ci]},type:'scatter'});
        } catch(_){}
      }
    } catch(e){console.warn('DIRM',d.name,e);}
  });
  return tr;
}

function tARM(samples) {
  const m=v=>v<=1;
  const tr=[
    {x:CHITON_DC.filter(m),y:CHITON_DC.filter(m).map((_,i)=>CHITON_MZ[i]/CHITON_IRM),mode:'lines',name:'Chiton (SD ref.)',line:{color:'#4a5568',width:1.5,dash:'dash'},type:'scatter'},
    {x:CHITON_DC.filter(m),y:CHITON_DC.filter(m).map((_,i)=>MS1_MZ[i]/MS1_IRM),mode:'lines',name:'MS1 (PSD ref.)',line:{color:'#2d3748',width:1.5,dash:'dash'},type:'scatter'},
  ];
  samples.forEach((d,i)=>{
    try {
      const arms=callPy('rmg_arm_curve',d._d||d);
      let arm=null;
      for(let j=0;j<arms.length;j++){const a=arms.get(j);if(a.doesExist&&a.fracmags){arm=a;}}
      if(!arm) return;
      const dc=pyArr(arm.treatmentDCFields).map(v=>v*1000);
      const fr=pyArr(arm.fracmags);
      const af=pyArr(arm.treatmentAFFields);
      const afL=af[0]||0;
      tr.push({x:dc,y:fr,mode:'lines+markers',name:`${d.samplename} (${Math.round(afL*1000)} mT)`,line:{color:col(i),width:2},marker:{size:5,color:col(i)},type:'scatter'});
    }catch(e){console.warn('ARM',d.name,e);}
  });
  return tr;
}

function tLF(samples, armOnly) {
  const tr=[];
  const AC=['#16a34a','#0891b2','#9333ea'], IC=['#111827','#1d4ed8','#b91c1c'];
  samples.forEach((d,i)=>{
    try {
      const curves=callPy('rmg_lowrie_fuller_curves',d._d||d);
      let lf=null;
      for(let j=0;j<curves.length;j++){const c=curves.get(j);if(c.doesExist)lf=c;}
      if(!lf) return;
      const ci=i%3;
      if(lf.ARMAF&&lf.ARMAF.doesExist){
        const af=pyArr(lf.ARMAF.treatmentAFFields).map(v=>v*1000);
        const mg=pyArr(lf.ARMAF.mmagNormalized);
        if(af.length>1) tr.push({x:af,y:mg,mode:'lines+markers',name:`${d.samplename} ARM`,line:{color:AC[ci],width:2},marker:{size:5,color:AC[ci]},type:'scatter'});
      }
      if(!armOnly&&lf.IRMAF&&lf.IRMAF.doesExist){
        const af=pyArr(lf.IRMAF.treatmentAFFields).map(v=>v*1000);
        const mg=pyArr(lf.IRMAF.mmagNormalized);
        if(af.length>1) tr.push({x:af,y:mg,mode:'lines+markers',name:`${d.samplename} IRM`,line:{color:IC[ci],width:2},marker:{size:5,color:IC[ci]},type:'scatter'});
      }
    }catch(e){console.warn('LF',d.name,e);}
  });
  return tr;
}

function tFuller(samples) {
  const tr=[];
  samples.forEach((d,i)=>{
    try {
      const fc=callPy('rmg_fuller_curves',d._d||d);
      if(!fc.doesExist) return;
      const irm=pyArr(fc.calcIRM);
      if(fc.NRM&&fc.NRM.doesExist&&fc.calcNRM){
        const nrm=pyArr(fc.calcNRM);
        const pos=irm.map((_,k)=>irm[k]>0&&nrm[k]>0?k:-1).filter(k=>k>=0);
        if(pos.length>1) tr.push({x:pos.map(k=>irm[k]),y:pos.map(k=>nrm[k]),mode:'lines+markers',name:`${d.samplename} NRM`,line:{color:'#94a3b8',width:2},marker:{size:5},type:'scatter'});
      }
      const calcARM=fc.calcARM;
      if(calcARM){
        const armArr=pyArr(calcARM);
        const pos=irm.map((_,k)=>irm[k]>0&&armArr[k]>0?k:-1).filter(k=>k>=0);
        if(pos.length>1) tr.push({x:pos.map(k=>irm[k]),y:pos.map(k=>armArr[k]),mode:'lines+markers',name:`${d.samplename} ARM`,line:{color:col(i),width:2},marker:{size:5,color:col(i)},type:'scatter'});
      }
    }catch(e){console.warn('Fuller',d.name,e);}
  });
  return tr;
}

function tBackfield(samples) {
  const tr=[];
  samples.forEach((d,i)=>{
    try {
      const bfs=callPy('rmg_irm_backfield_curve',d._d||d);
      let bf=null;
      for(let j=0;j<bfs.length;j++){const b=bfs.get(j);if(b.doesExist)bf=b;}
      if(!bf) return;
      const flds=pyArr(bf.Demag.treatmentDCFields).map(v=>v*1000);
      const mz=pyArr(bf.Demag.mvector.toJs()[2]).map(v=>v/(d._d?.mass||1));
      tr.push({x:flds,y:mz,mode:'lines+markers',name:d.samplename,line:{color:col(i),width:2},marker:{size:5,color:col(i)},type:'scatter'});
    }catch(e){console.warn('BF',d.name,e);}
  });
  if(tr.length){
    const xmax=Math.max(...tr.flatMap(t=>t.x));
    tr.push({x:[0,xmax],y:[0,0],mode:'lines',showlegend:false,line:{color:'#4a5568',width:1},type:'scatter'});
  }
  return tr;
}

function tCoercivity(samples) {
  const stats=samples.map(d=>{
    try{return callPy('rmg_stats',[d._d||d]).get(0);}catch(_){return null;}
  });
  const names=samples.map(d=>d.samplename);
  const hcr=stats.map(s=>safeFloat(s?.Hcr)||0);
  const mdf=stats.map(s=>safeFloat(s?.MDFofIRM)||0);
  return [
    {x:names,y:hcr,type:'bar',name:'Hcr (mT)',marker:{color:samples.map((_,i)=>col(i))}},
    {x:names,y:mdf,type:'bar',name:'MDF IRM (mT)',marker:{color:samples.map((_,i)=>col(i+5))}},
  ];
}

// ── Stats ────────────────────────────────────────────────────────────────────
async function runStats(samples) {
  const rows=[];
  for(const d of samples){
    try{
      const s=callPy('rmg_stats',[d._d||d]).get(0);
      rows.push({
        sample:d.samplename, sIRM:safeFloat(s.sIRM), sIRMkg:safeFloat(s.sIRMperkg),
        Hcr:safeFloat(s.Hcr), R:safeFloat(s.CisowskiR), MDF_IRM:safeFloat(s.MDFofIRM),
        MDF_ARM:safeFloat(s.MDFofARM), ARM_IRM:safeFloat(s.ARMtoIRMat100uT),
        kARM:safeFloat(s.ARMsusceptibilityToIRM), chi:safeFloat(s.susceptibility),
        IRM30:safeFloat(s.IRM30toIRM100), IRM100:safeFloat(s.IRM100toIRM300),
        DP:safeFloat(s.DPofIRMAcq), skew:safeFloat(s.SkewnessofIRMAcq),
      });
    }catch(e){console.warn(d.samplename,e);}
  }
  S.lastStats=rows;
  const COLS=[
    {k:'sample',l:'Sample',f:v=>v,c:''},
    {k:'sIRM',l:'sIRM (Am²)',f:sci,c:'num'},{k:'sIRMkg',l:'sIRM/kg',f:sci,c:'num'},
    {k:'Hcr',l:'Hcr (mT)',f:n2,c:'num'},{k:'R',l:'R',f:n2,c:'num'},
    {k:'MDF_IRM',l:'MDF IRM',f:n2,c:'num'},{k:'MDF_ARM',l:'MDF ARM',f:n2,c:'num'},
    {k:'ARM_IRM',l:'ARM/IRM',f:n4,c:'num'},{k:'kARM',l:'k_ARM/IRM',f:sci,c:'num'},
    {k:'chi',l:'χ',f:sci,c:'num'},{k:'IRM30',l:'IRM30/100',f:n2,c:'num'},
    {k:'IRM100',l:'IRM100/300',f:n2,c:'num'},{k:'DP',l:'DP IRM',f:n2,c:'num'},
    {k:'skew',l:'Skew',f:n2,c:'num'},
  ];
  buildTable('sh','sb',COLS,rows);
  showPanel('stats-panel');
  document.getElementById('stats-lbl').textContent=`statistics — ${samples.length} sample(s)`;
  document.getElementById('ptitle').textContent=`stats — ${samples.length} sample(s)`;
  log(`stats for ${samples.length} sample(s)`,'ok');
}

async function runCoer(samples) {
  const rows=[];
  for(const d of samples){
    try{
      const s=callPy('rmg_stats',[d._d||d]).get(0);
      rows.push({sample:d.samplename,Hcr:safeFloat(s.Hcr),MDF_IRM:safeFloat(s.MDFofIRM),MDF_ARM:safeFloat(s.MDFofARM),R:safeFloat(s.CisowskiR),MAF:safeFloat(s.MAFofIRM),DP:safeFloat(s.DPofIRMAcq)});
    }catch(e){}
  }
  S.lastStats=rows;
  const COLS=[{k:'sample',l:'Sample',f:v=>v,c:''},{k:'Hcr',l:'Hcr (mT)',f:n2,c:'num'},{k:'MDF_IRM',l:'MDF IRM',f:n2,c:'num'},{k:'MDF_ARM',l:'MDF ARM',f:n2,c:'num'},{k:'R',l:'R',f:n2,c:'num'},{k:'MAF',l:'MAF IRM',f:n2,c:'num'},{k:'DP',l:'DP IRM',f:n2,c:'num'}];
  buildTable('ch','cb',COLS,rows);
  showPanel('coer-panel');
  document.getElementById('ptitle').textContent=`coercivity — ${samples.length} sample(s)`;
  log(`coercivity table for ${samples.length} sample(s)`,'ok');
}

function buildTable(hid,bid,cols,rows){
  document.getElementById(hid).innerHTML='<tr>'+cols.map(c=>`<th>${c.l}</th>`).join('')+'</tr>';
  document.getElementById(bid).innerHTML=rows.map(row=>'<tr>'+cols.map(c=>{const v=row[c.k];return v==null?'<td class="nil">—</td>':`<td class="${c.c}">${c.f(v)}</td>`}).join('')+'</tr>').join('');
}

function sci(v){return typeof v==='number'?v.toExponential(3):v}
function n2(v){return typeof v==='number'?v.toFixed(2):v}
function n4(v){return typeof v==='number'?v.toFixed(4):v}

// ── CSV download ─────────────────────────────────────────────────────────────
function doCSV(samples) {
  const rows=[];
  const keys=['sample','sIRM','sIRMperkg','Hcr','CisowskiR','MDFofIRM','MAFofIRM','MDFofARM','ARMtoIRMat100uT','ARMsusceptibilityToIRM','susceptibility','IRM30toIRM100','IRM100toIRM300','DPofIRMAcq','SkewnessofIRMAcq'];
  rows.push(keys.join(','));
  for(const d of samples){
    try{
      const s=callPy('rmg_stats',[d._d||d]).get(0);
      const row=keys.map(k=>{
        if(k==='sample') return d.samplename;
        const v=safeFloat(s[k]);
        return v===null?'':v;
      });
      rows.push(row.join(','));
    }catch(_){}
  }
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rockmag_stats.csv';
  a.click();
}

function dlCSV(){doCSV(getSelected());}

// ── Save image ───────────────────────────────────────────────────────────────
function showSave(){ document.getElementById('save-ov').className='vis'; }
function hideSave(){ document.getElementById('save-ov').className=''; }

async function doSave(){
  const fmt=document.querySelector('input[name="sf"]:checked')?.value||'png';
  const w=parseInt(document.getElementById('sw').value)||1200;
  const h=parseInt(document.getElementById('sh2').value)||800;
  const fn=(document.getElementById('sfn').value||'pyrockmag_plot').trim();
  const res=document.getElementById('sres');
  res.textContent='saving…';
  try{
    const div=document.getElementById('dash-grid').classList.contains('vis')
      ? document.getElementById('d0')
      : document.getElementById('plotly-div');
    if(!div||!div.data){res.style.color='var(--red)';res.textContent='no plot to save';return;}
    const img=await Plotly.toImage(div,{format:fmt,width:w,height:h});
    const a=document.createElement('a');
    a.href=img; a.download=`${fn}.${fmt}`; a.click();
    res.style.color='var(--ac2)'; res.textContent=`✓ saved ${fn}.${fmt}`;
  }catch(e){res.style.color='var(--red)';res.textContent='Error: '+e.message;}
}

// ── UI helpers ────────────────────────────────────────────────────────────────
const PANELS=['stats-panel','coer-panel'];
function hideAll(){
  document.getElementById('plotly-div').className='';
  document.getElementById('dash-grid').className='';
  document.getElementById('pempty').style.display='';
  PANELS.forEach(p=>{const el=document.getElementById(p);if(el)el.className='panel';});
  S.dashVis=false;
}
function showPanel(id){hideAll();const el=document.getElementById(id);if(el)el.className='panel vis';document.getElementById('pempty').style.display='none';}
function spinner(v,msg=''){document.getElementById('spinner').className=v?'vis':'';document.getElementById('spin-msg').textContent=msg||'';}
function setStatus(s){document.getElementById('stxt').textContent=s;document.getElementById('sdot').className=s==='idle'?'ok':'';}
function log(msg,t=''){const e=document.getElementById('lm');e.textContent=msg;e.className=t;}

function toggleTheme(){
  const L=document.documentElement.classList.toggle('light');
  document.getElementById('theme-btn').textContent=L?'◑ dark':'◑ light';
  localStorage.setItem('pyr-theme',L?'light':'dark');
  // re-render existing plots with updated colours
  const pDiv=document.getElementById('plotly-div');
  if(pDiv.classList.contains('vis')&&pDiv.data) {
    const op=S.activeOp||'IRM';
    const samples=getSelected();
    if(samples.length) {
      const layout=buildLayout(samples,op);
      Plotly.relayout(pDiv,layout);
    }
  }
  if(S.dashVis) for(let i=0;i<8;i++){const c=document.getElementById('d'+i);if(c)Plotly.Plots.resize(c);}
}
(()=>{if(localStorage.getItem('pyr-theme')==='light'){document.documentElement.classList.add('light');document.getElementById('theme-btn').textContent='◑ dark';}})();

window.addEventListener('resize',()=>{
  const d=document.getElementById('plotly-div');
  if(d.classList.contains('vis'))Plotly.Plots.resize(d);
  if(S.dashVis)for(let i=0;i<8;i++){const c=document.getElementById('d'+i);if(c)Plotly.Plots.resize(c);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&document.activeElement.tagName!=='INPUT')runAnalysis();
  if(e.key==='Escape')hideSave();
});

// ── Pyodide bootstrap ─────────────────────────────────────────────────────────
async function initPyodide(){
  const bar=document.getElementById('pyodide-bar');
  const prog=document.getElementById('pyodide-prog');
  bar.style.display='block';

  function setP(n,msg){
    prog.style.width=n+'%';
    log(msg,'');
    document.getElementById('spin-msg').textContent=msg;
    document.getElementById('empty-sub').textContent=msg;
  }

  try{
    setP(5,'loading pyodide runtime…');
    const py = await loadPyodide({
      indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/',
      stdout: s=>console.log('[py]',s),
      stderr: s=>console.warn('[py]',s),
    });
    setP(30,'installing numpy…');
    await py.loadPackage('numpy');
    setP(55,'installing scipy…');
    await py.loadPackage('scipy');
    setP(75,'loading rmg_import…');
    py.runPython(PY['rmg_import']);
    setP(85,'loading rmg_curves…');
    py.runPython(PY['rmg_curves']);
    setP(95,'loading rmg_stats…');
    py.runPython(PY['rmg_stats']);
    setP(100,'ready');
    S.py = py;
    bar.style.display='none';
    document.getElementById('empty-title').textContent='drop .rmg files to begin';
    document.getElementById('empty-sub').textContent='drop files onto the left panel\nor click the folder icon to browse';
    setStatus('idle');
    log('python ready — drop .rmg files to begin','ok');
  }catch(e){
    log('failed to load python: '+e.message,'err');
    document.getElementById('empty-title').textContent='failed to load python';
    document.getElementById('empty-sub').textContent=e.message;
    bar.style.display='none';
  }
}

renderOps();
spinner(true,'loading python…');

// Load Pyodide script then init
const pScript=document.createElement('script');
pScript.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
pScript.onload=()=>initPyodide();
pScript.onerror=()=>log('failed to load pyodide.js — check internet connection','err');
document.head.appendChild(pScript);
</script>

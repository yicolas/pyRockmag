<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>pyRockmag</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e0f;--bg2:#111518;--bg3:#171c1e;--bg4:#1e2426;--bdr:#2a3235;--bdr2:#3a4548;--ac:#00e676;--ac2:#00c853;--ac3:#1b5e20;--acd:#2e7d32;--amb:#ffd54f;--red:#ef5350;--tx:#e0e8e6;--tx2:#8fa8a4;--tx3:#4a6360;--mono:'IBM Plex Mono',monospace;--r:4px}
:root.light{--bg:#f5f2ed;--bg2:#ede9e2;--bg3:#e4dfd7;--bg4:#d8d1c7;--bdr:#c8bfb2;--bdr2:#a89880;--ac:#c45000;--ac2:#e05a00;--ac3:#fff0e6;--acd:#d96000;--amb:#b35000;--red:#cc2200;--tx:#1a1208;--tx2:#4a3820;--tx3:#8c7055}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:13px;overflow:hidden}
#app{display:grid;grid-template-rows:44px 1fr 30px;height:100vh}
#topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bdr);background:var(--bg2)}
.logo{color:var(--ac);font-weight:600;font-size:14px;letter-spacing:.05em}
.sep{color:var(--bdr2)}.tag{color:var(--tx3);font-size:11px}.sp{flex:1}
#sdot{width:7px;height:7px;border-radius:50%;background:var(--ac3)}.ok{background:var(--ac)!important}
#stxt{color:var(--tx2);font-size:11px}
.btn{background:transparent;border:1px solid var(--bdr2);color:var(--tx2);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:var(--r);cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--acd);color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac3);border-color:var(--acd);color:var(--ac)}.btn.pri:hover{background:var(--acd)}
.btn.dng{border-color:#4a1c1c;color:var(--red)}.btn.dng:hover{background:#1a0a0a}
.btn.sm{padding:3px 7px;font-size:10px}
#body{display:grid;grid-template-columns:270px 200px 1fr;overflow:hidden}
.col{display:flex;flex-direction:column;border-right:1px solid var(--bdr);overflow:hidden}
.col:last-child{border-right:none}
.chdr{padding:7px 14px;background:var(--bg3);border-bottom:1px solid var(--bdr);color:var(--ac2);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
/* Col 1 */
#drop-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 16px;border:2px dashed var(--bdr2);border-radius:8px;margin:12px;cursor:pointer;transition:all .2s;color:var(--tx3);font-size:12px;text-align:center;flex-shrink:0}
#drop-zone:hover,#drop-zone.over{border-color:var(--ac2);color:var(--ac2);background:rgba(0,200,83,.04)}
#drop-zone input{display:none}
.dz-icon{font-size:26px;line-height:1}
.btn-row{display:flex;gap:5px;padding:6px 12px;border-bottom:1px solid var(--bdr);background:var(--bg2)}
#sample-list{flex:1;overflow-y:auto;padding:4px 0}
#sample-list::-webkit-scrollbar{width:4px}#sample-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.si{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;border-left:2px solid transparent;transition:background .1s}
.si:hover{background:var(--bg3)}.si.sel{background:var(--bg4);border-left-color:var(--ac)}
.si-chk{width:13px;height:13px;accent-color:var(--ac);flex-shrink:0}
.si-name{flex:1;color:var(--tx);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-meta{font-size:9px;color:var(--tx3)}
.cbar{padding:5px 12px;border-top:1px solid var(--bdr);color:var(--tx3);font-size:10px;background:var(--bg2)}
/* Col 2 */
#col-ops{background:var(--bg2);overflow-y:auto}
#col-ops::-webkit-scrollbar{width:4px}#col-ops::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.shdr{padding:8px 14px 4px;color:var(--tx3);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--bdr);margin-top:4px}
.shdr:first-child{border-top:none;margin-top:0}
.op{display:flex;align-items:center;padding:7px 14px;cursor:pointer;border-left:2px solid transparent;transition:background .1s}
.op:hover{background:var(--bg3)}.op.active{background:var(--bg4);border-left-color:var(--ac2)}
.ok{color:var(--ac2)!important}.op-key{color:var(--ac2);font-size:11px;font-weight:600;width:60px;flex-shrink:0}
.op-desc{color:var(--tx2);font-size:10px;line-height:1.3}
.prow{display:flex;gap:5px;padding:8px 12px;border-top:1px solid var(--bdr)}
/* Col 3 */
#col3{display:flex;flex-direction:column}
#phdr{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0}
#ptitle{font-size:12px;font-weight:600;color:var(--tx);flex:1}
.hopt{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--tx3)}
.tgl{accent-color:var(--ac)}
#run-btn{background:var(--ac3);border:1px solid var(--acd);color:var(--ac);font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 18px;border-radius:var(--r);cursor:pointer;transition:all .15s}
#run-btn:hover{background:var(--acd)}#run-btn:disabled{opacity:.4;cursor:default}
#parea{flex:1;position:relative;overflow:hidden}
#pempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx3)}
.et{font-size:13px;color:var(--tx2)}.es{font-size:11px;max-width:280px;text-align:center;line-height:1.6}
#spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,15,.88);z-index:10;flex-direction:column;gap:12px}
#spinner.vis{display:flex}
.ring{width:32px;height:32px;border-radius:50%;border:2px solid var(--bdr2);border-top-color:var(--ac);animation:spin .7s linear infinite}
#spin-msg{color:var(--tx2);font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}
#plotly-div{position:absolute;inset:0;display:none}#plotly-div.vis{display:block}
#dash-grid{display:none;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bdr);position:absolute;inset:0}
#dash-grid.vis{display:grid}
.dc{background:var(--bg);overflow:hidden;min-height:0}
.panel{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}.panel.vis{display:flex}
.ptb{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0}
.plbl{font-size:11px;color:var(--tx2);flex:1}
.tw{flex:1;overflow:auto;padding:10px 14px}
.tw::-webkit-scrollbar{width:4px;height:4px}.tw::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
table.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{text-align:left;padding:5px 10px;border-bottom:1px solid var(--bdr2);color:var(--ac2);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.dt td{padding:5px 10px;border-bottom:1px solid var(--bdr);color:var(--tx);white-space:nowrap}
.dt tr:hover td{background:var(--bg3)}.dt td.num{color:var(--ac);font-variant-numeric:tabular-nums}.dt td.nil{color:var(--tx3)}
#save-ov{position:absolute;inset:0;display:none;background:rgba(10,14,15,.92);z-index:20;align-items:center;justify-content:center}
#save-ov.vis{display:flex}
.sbox{background:var(--bg3);border:1px solid var(--bdr2);border-radius:6px;padding:20px 24px;width:370px;display:flex;flex-direction:column;gap:12px}
.stitle{font-size:13px;font-weight:600;color:var(--ac);display:flex;justify-content:space-between}
.fr{display:flex;flex-direction:column;gap:4px}
.fr label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.fr input,.fr select{background:var(--bg);border:1px solid var(--bdr);color:var(--tx);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:var(--r);outline:none;width:100%}
.fr input:focus,.fr select:focus{border-color:var(--ac3)}.fr select option{background:var(--bg3)}
.rrow{display:flex;gap:14px;flex-wrap:wrap}
.rrow label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);cursor:pointer}
.rrow input[type=radio]{accent-color:var(--ac)}
#logbar{display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--bdr);background:var(--bg2);overflow:hidden}
.ll{color:var(--tx3);font-size:10px;flex-shrink:0}
#lm{color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#lm.ok{color:var(--ac2)}#lm.err{color:var(--red)}#lm.warn{color:var(--amb)}
#pyodide-bar{display:none;position:fixed;bottom:32px;left:0;right:0;height:4px;background:var(--bdr);z-index:100}
#pyodide-prog{height:100%;background:var(--ac);width:0;transition:width .3s}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <span class="logo">⬡ pyRockmag</span><span class="sep">|</span>
  <span class="tag">rock magnetism · pyodide edition</span><div class="sp"></div>
  <button class="btn sm" id="theme-btn" onclick="toggleTheme()">◑ light</button>
  <div id="sdot"></div><span id="stxt">loading…</span>
</div>
<div id="body">

  <!-- COL 1: samples -->
  <div class="col" id="col1">
    <div class="chdr">01 / samples</div>
    <div id="drop-zone" onclick="document.getElementById('file-inp').click()"
         ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="onDrop(event)">
      <div class="dz-icon">📂</div>
      <div>drop .rmg files here<br>or click to browse</div>
      <input id="file-inp" type="file" accept=".rmg,.frc,.cor" multiple onchange="onFiles(this.files)">
    </div>
    <div class="btn-row">
      <button class="btn sm" onclick="selAll()">all</button>
      <button class="btn sm" onclick="selNone()">none</button>
      <div style="flex:1"></div>
      <button class="btn sm dng" onclick="removeSelected()">remove</button>
      <button class="btn sm dng" onclick="clearAll()">clear</button>
    </div>
    <div id="sample-list"></div>
    <div class="cbar" id="cbar">0 samples loaded</div>
  </div>

  <!-- COL 2: operations -->
  <div class="col" id="col-ops">
    <div class="chdr">02 / analysis</div>
    <div id="op-list"></div>
    <div class="prow">
      <button class="btn sm" onclick="preset('core')">core</button>
      <button class="btn sm" onclick="preset('all')">all</button>
      <button class="btn sm" onclick="preset('none')">none</button>
    </div>
  </div>

  <!-- COL 3: plot -->
  <div class="col" id="col3">
    <div id="phdr">
      <span id="ptitle">— load files &amp; run —</span>
      <label class="hopt"><input type="checkbox" class="tgl" id="opt-overlay"> overlay</label>
      <button class="btn sm" style="border-color:#1e3a5f;color:#60a5fa" onclick="showSave()">save…</button>
      <button id="run-btn" onclick="runAnalysis()" disabled>▶ run</button>
    </div>
    <div id="parea">
      <div id="pempty">
        <div class="et" id="empty-title">initialising python…</div>
        <div class="es" id="empty-sub">loading pyodide + numpy + scipy<br>this takes ~10s on first visit</div>
      </div>
      <div id="spinner"><div class="ring"></div><div id="spin-msg"></div></div>
      <div id="plotly-div"></div>
      <div id="dash-grid">
        <div id="d0" class="dc"></div><div id="d1" class="dc"></div>
        <div id="d2" class="dc"></div><div id="d3" class="dc"></div>
        <div id="d4" class="dc"></div><div id="d5" class="dc"></div>
        <div id="d6" class="dc"></div><div id="d7" class="dc"></div>
      </div>
      <!-- stats panel -->
      <div class="panel" id="stats-panel">
        <div class="ptb"><span class="plbl" id="stats-lbl">statistics</span>
          <button class="btn sm" onclick="dlCSV()">download CSV</button></div>
        <div class="tw"><table class="dt"><thead id="sh"></thead><tbody id="sb"></tbody></table></div>
      </div>
      <!-- coercivity panel -->
      <div class="panel" id="coer-panel">
        <div class="ptb"><span class="plbl">coercivity values</span>
          <button class="btn sm" onclick="dlCSV()">download CSV</button></div>
        <div class="tw"><table class="dt"><thead id="ch"></thead><tbody id="cb"></tbody></table></div>
      </div>
      <!-- save overlay -->
      <div id="save-ov">
        <div class="sbox">
          <div class="stitle">save plot <button class="btn sm" onclick="hideSave()">✕</button></div>
          <div class="fr"><label>format</label>
            <div class="rrow">
              <label><input type="radio" name="sf" value="png" checked> PNG</label>
              <label><input type="radio" name="sf" value="svg"> SVG</label>
              <label><input type="radio" name="sf" value="jpeg"> JPG</label>
            </div>
          </div>
          <div class="fr"><label>width (px)</label><input id="sw" type="number" value="1200" min="400" max="4000" step="100"></div>
          <div class="fr"><label>height (px)</label><input id="sh2" type="number" value="800" min="300" max="3000" step="100"></div>
          <div class="fr"><label>filename</label><input id="sfn" value="pyrockmag_plot" placeholder="pyrockmag_plot"></div>
          <button class="btn pri" onclick="doSave()" style="width:fit-content">save image</button>
          <div id="sres" style="font-size:11px;color:var(--ac2);min-height:16px"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="logbar"><span class="ll">▶</span><span id="lm">starting up…</span></div>
</div>
<div id="pyodide-bar"><div id="pyodide-prog"></div></div>

<script>
// ── Embedded Python sources ──────────────────────────────────────────────────
const PY = {};
PY['rmg_import'] = "\"\"\"\nrmg_import.py\n-------------\nPython translation of RMGImport.m by Robert E. Kopp (2008).\nParses a 2G .rmg file and returns an RmgData object.\n\nObserved file format (Shoemaker 2G Magnetometer):\n  Row 0  : title  e.g. \"    Basalt1.1,,Vol: 1, \"\n  Row 1  : header e.g. \" ,Level,Bias Field (G),Spin Speed (rps),Hold Time (s),Mz (emu),...\"\n  Row 2+ : data rows \u2014 step type is the FIRST comma-delimited token; columns follow.\n           Rows whose step type starts with \"Instrument\" or \"Time:\" are metadata and skipped.\n\nColumn layout (0-based AFTER the step-type token):\n  0  Level            \u2013 applied field magnitude (Oe/Gauss)\n  1  Bias Field (G)   \u2013 DC bias / ARM bias (Gauss)\n  2  Spin Speed (rps)\n  3  Hold Time (s)\n  4  Mz (emu)\n  5  Std Dev Z\n  6  Mz/Vol           \u2013 moment per volume\n  7  Moment Susceptibility (emu/Oe)\n  8  Mx (emu)\n  9  Std Dev X\n  10 My (emu)\n  ...\n\nUnit conversions applied here:\n  Fields  : Oe / Gauss \u2192 Tesla   (\u00d7 1e-4)\n  Moments : emu        \u2192 Am\u00b2     (\u00d7 1e-3)\n\nStep-type vocabulary in this file:\n  NRM          natural remanent magnetisation (baseline)\n  AF           AF demagnetisation of NRM\n  AFmax        maximum-field baseline (before/after IRM block)\n  IRMz         IRM acquisition step (z-axis, field in Level column)\n  AFz          AF demagnetisation of IRM/ARM (z-axis, field in Level column)\n  ARM          ARM acquisition step (AF in Level, DC bias in Bias column)\n\nCopyright (C) 2008 Robert E. Kopp (original MATLAB code), GNU GPL v.3\nPython port 2025.\n\"\"\"\n\nimport re\nimport numpy as np\n\nMU0          = 4 * np.pi * 1e-7\nOE_TO_T      = 1e-4      # Oersted / Gauss \u2192 Tesla\nEMU_TO_AM2   = 1e-3      # emu \u2192 Am\u00b2\n\n\nclass RmgData:\n    \"\"\"Container matching the MATLAB Rmg structure fields.\"\"\"\n    pass\n\n\ndef _f(s):\n    \"\"\"Parse a string to float, return nan on failure.\"\"\"\n    try:\n        return float(s.strip())\n    except (ValueError, TypeError, AttributeError):\n        return np.nan\n\n\ndef rmg_import(filename: str) -> RmgData:\n    \"\"\"\n    Parse a .rmg file and return an RmgData object.\n\n    Parameters\n    ----------\n    filename : str  \u2013 path to the .rmg file\n\n    Returns\n    -------\n    RmgData\n    \"\"\"\n    with open(filename, 'r', errors='replace') as fh:\n        lines = [ln.rstrip('\\r\\n') for ln in fh.readlines()]\n\n    # drop trailing blank lines\n    while lines and not lines[-1].strip():\n        lines.pop()\n\n    y = RmgData()\n\n    # \u2500\u2500 Row 0: title \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    y.titlerow   = lines[0]\n    title_toks   = [t.strip() for t in lines[0].split(',')]\n    y.samplename = title_toks[0].strip() if title_toks else 'unknown'\n    y.sampledesc = title_toks[1].strip() if len(title_toks) > 1 else ''\n\n    # Extract mass/volume from title (e.g. \"Vol: 1\" or \"Mass: 0.152\")\n    y.mass = np.nan\n    for tok in title_toks:\n        m = re.search(r'(?:Vol|Mass|vol|mass)[:\\s]+([\\d.eE+\\-]+)', tok)\n        if m:\n            val = float(m.group(1))\n            if val != 1.0:          # \"Vol: 1\" is a placeholder, not a real mass\n                y.mass = val\n            break\n\n    # \u2500\u2500 Row 1: header \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    y.headerrow   = lines[1]\n    hdr           = [t.strip() for t in lines[1].split(',')]\n    # hdr[0] is blank (step-type label); hdr[1] = \"Level\" \u2192 data index 0, etc.\n\n    # Column index within the data portion (i.e. hdr[k] \u2192 data index k-1)\n    col = {}\n    for k, h in enumerate(hdr):\n        if k == 0:\n            continue\n        di  = k - 1\n        hl  = h.lower()\n        if 'level' in hl:\n            col['level'] = di\n        elif 'bias' in hl:\n            col['bias'] = di\n        elif 'spin' in hl:\n            col['spin'] = di\n        elif hl == 'mz (emu)' or hl == 'mz':\n            col.setdefault('mz', di)\n        elif hl == 'mx (emu)' or hl == 'mx':\n            col.setdefault('mx', di)\n        elif hl == 'my (emu)' or hl == 'my':\n            col.setdefault('my', di)\n        elif 'mz/vol' in hl or 'mz/mass' in hl:\n            col['mzperkg'] = di\n        elif 'suscept' in hl:\n            col['suscep'] = di\n        elif 'date' in hl or 'time' in hl:\n            col['datetime'] = di\n\n    ncols = len(hdr) - 1     # number of data columns (excluding step-type)\n\n    # \u2500\u2500 Rows 2+: data \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Skip metadata rows (Instrument:, Time:)\n    SKIP_PREFIXES = ('instrument', 'time:')\n\n    steptypes = []\n    raw_data  = []    # list of lists: raw_data[row][col_idx]\n\n    for line in lines[2:]:\n        if not line.strip():\n            continue\n        parts   = [p.strip() for p in line.split(',')]\n        stype   = parts[0]\n        if any(stype.lower().startswith(p) for p in SKIP_PREFIXES):\n            continue\n        steptypes.append(stype)\n        vals = parts[1:]          # everything after the step-type token\n        # pad or trim to ncols\n        row = [vals[i] if i < len(vals) else '' for i in range(ncols)]\n        raw_data.append(row)\n\n    n = len(steptypes)\n    y.steptypes = steptypes\n\n    def get_col(name):\n        if name not in col:\n            return np.full(n, np.nan)\n        di = col[name]\n        return np.array([_f(raw_data[r][di]) for r in range(n)], dtype=float)\n\n    # Raw CGS values\n    levels_raw  = get_col('level')     # Oe / Gauss\n    bias_raw    = get_col('bias')      # Gauss\n    mz_raw      = get_col('mz')        # emu\n    mx_raw      = get_col('mx')        # emu\n    my_raw      = get_col('my')        # emu\n    mzperkg_raw = get_col('mzperkg')   # emu/cm\u00b3 or emu/g\n    suscep_raw  = get_col('suscep')\n    y.spin      = get_col('spin')\n\n    # Convert to SI\n    levels_T = levels_raw * OE_TO_T    # Tesla\n    bias_T   = bias_raw   * OE_TO_T    # Tesla\n    mz       = mz_raw     * EMU_TO_AM2 # Am\u00b2\n    mx       = mx_raw     * EMU_TO_AM2\n    my       = my_raw     * EMU_TO_AM2\n    mzperkg  = mzperkg_raw * EMU_TO_AM2\n\n    y.mz      = mz\n    y.mx      = mx\n    y.my      = my\n    y.mzperkg = mzperkg\n    y.suscep  = suscep_raw\n\n    # \u2500\u2500 Step-type index arrays \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    def match(pattern, exact=False):\n        pat = pattern.lower()\n        out = []\n        for i, s in enumerate(steptypes):\n            sl = s.lower()\n            if exact:\n                if sl == pat:\n                    out.append(i)\n            else:\n                if sl.startswith(pat):\n                    out.append(i)\n        return np.array(out, dtype=int)\n\n    y.stepsNRM     = match('nrm')\n    y.stepsAFmax   = match('afmax')\n    y.stepsAFz     = match('afz')\n    y.stepsAF_nrm  = match('af', exact=True)  # pure 'AF' = NRM demagnetisation\n    y.stepsAF      = np.sort(np.union1d(y.stepsAFz, y.stepsAF_nrm))\n    y.stepsIRM     = match('irm')   # IRMz, IRMx, IRM\n    y.stepsARM     = match('arm')\n    y.stepsRRM     = match('rrm')\n    y.stepsThermal = np.sort(np.union1d(match('tt'), match('trm')))\n\n    # \u2500\u2500 Treatment field arrays (SI) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    y.treatmentAFFields = np.zeros(n)\n    y.treatmentDCFields = np.zeros(n)\n    y.bias              = np.zeros(n)\n\n    # AF demagnetisation steps: Level = the AF field applied\n    for idx in np.concatenate([y.stepsAF, y.stepsAFmax]):\n        y.treatmentAFFields[idx] = levels_T[idx]\n\n    # ARM: Level = AF field, Bias = DC bias\n    for idx in y.stepsARM:\n        y.treatmentAFFields[idx] = levels_T[idx]\n        y.treatmentDCFields[idx] = bias_T[idx]\n        y.bias[idx]              = bias_T[idx]\n\n    # IRM acquisition: Level = the DC field applied\n    for idx in y.stepsIRM:\n        y.treatmentDCFields[idx] = levels_T[idx]\n\n    # RRM\n    for idx in y.stepsRRM:\n        y.treatmentAFFields[idx] = levels_T[idx]\n\n    # \u2500\u2500 mvector (3 \u00d7 n) in Am\u00b2 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    y.mvector = np.vstack([mx, my, mz])    # shape (3, n)\n\n    if np.isfinite(y.mass) and y.mass > 0:\n        y.mvectorperkg = y.mvector / y.mass\n    else:\n        y.mvectorperkg = y.mvector * np.nan\n\n    # \u2500\u2500 Block detection \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Normalise variant step types into canonical block types so that\n    # e.g. IRMz/IRMx are treated as the same block as IRM, and AFz as AF.\n    def _canon(s):\n        sl = s.lower()\n        if sl in ('afz',):               return 'AF'\n        if sl in ('irmz', 'irmx'):       return 'IRM'\n        if sl in ('afmax',):             return 'AFMAX'\n        if sl in ('nrm',):               return 'NRM'\n        if sl in ('arm',):               return 'ARM'\n        if sl in ('af',):                return 'AF'\n        return s.upper()\n\n    norm = [_canon(s) for s in steptypes]\n\n    stepBlock = np.zeros(n, dtype=int)\n    blockType = []\n    blockSize = []\n\n    if n > 0:\n        stepBlock[0] = 1\n        blockType.append(norm[0])\n        blockSize.append(1)\n        for i in range(1, n):\n            if norm[i] != norm[i - 1]:\n                new_id = stepBlock[i - 1] + 1\n                stepBlock[i] = new_id\n                blockType.append(norm[i])\n                blockSize.append(1)\n            else:\n                stepBlock[i] = stepBlock[i - 1]\n                blockSize[-1] += 1\n\n    y.stepBlock = stepBlock       # 1-based block IDs (matches MATLAB convention)\n    y.BlockType = blockType       # list indexed by (block_id - 1)\n    y.BlockSize = np.array(blockSize, dtype=int)\n\n    # \u2500\u2500 Compatibility attributes expected by rmg_curves.py \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    y.levels         = levels_raw          # raw Oe/Gauss field labels\n    # y.bias already set above as per-step DC bias in Tesla\n    # treatmentTemps: room temperature for all steps (no thermal data in this file)\n    y.treatmentTemps = np.full(n, 298.0)\n    for idx in y.stepsThermal:\n        y.treatmentTemps[idx] = levels_T[idx]   # thermal steps use Level as temp\n    return y\n\n";
PY['rmg_curves'] = "\"\"\"\nrmg_curves.py\n-------------\nPython translations of the curve-extraction MATLAB functions:\n  - moving()\n  - rmg_af_level_find()\n  - rmg_extract_af_of_step()\n  - rmg_sirm_curve()\n  - rmg_arm_curve()\n  - rmg_irm_backfield_curve()\n  - rmg_rrm_curve()\n  - rmg_lowrie_fuller_curves()\n  - rmg_fuller_curves()\n\nCopyright (C) 2008 Robert E. Kopp (original MATLAB code), GNU GPL v.3\nPython port 2025.\n\"\"\"\n\nimport numpy as np\nfrom scipy.interpolate import interp1d\n\n\nMU0 = 4 * np.pi * 1e-7\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  Utility helpers\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef moving(y, span):\n    \"\"\"\n    Moving average matching MATLAB's moving() / smooth() behaviour.\n    Handles edge effects with triangular weighting at ends.\n    \"\"\"\n    y = np.asarray(y, dtype=float).ravel()\n    span = int(np.floor(span))\n    n = len(y)\n    span = min(span, n)\n    width = span - 1 + (span % 2)   # force odd\n    if width <= 1:\n        return y.copy()\n\n    # main filter\n    kernel = np.ones(width) / width\n    c = np.convolve(y, kernel, mode='full')[:n]\n\n    # beginning edge\n    cbegin_vals = []\n    for i in range(1, width - 1, 2):\n        cbegin_vals.append(np.sum(y[:i + 1]) / (i + 1))\n    cbegin = np.array(cbegin_vals)\n\n    # end edge\n    cend_vals = []\n    for i in range(1, width - 1, 2):\n        cend_vals.append(np.sum(y[n - i - 1:]) / (i + 1))\n    cend = np.array(cend_vals[::-1])\n\n    # combine\n    mid = c[width - 1:]\n    result = np.concatenate([cbegin, mid, cend])\n    # safety: match length\n    if len(result) != n:\n        result = np.interp(np.arange(n), np.linspace(0, n - 1, len(result)), result)\n    return result\n\n\ndef _safe_interp1(x, y, xi, kind='linear', fill_value='extrapolate'):\n    \"\"\"Wrapper around scipy interp1d that handles edge cases.\"\"\"\n    x = np.asarray(x, dtype=float)\n    y = np.asarray(y, dtype=float)\n    xi = np.atleast_1d(np.asarray(xi, dtype=float))\n    valid = np.isfinite(x) & np.isfinite(y)\n    if np.sum(valid) < 2:\n        return np.full_like(xi, np.nan, dtype=float)\n    try:\n        f = interp1d(x[valid], y[valid], kind=kind,\n                     bounds_error=False, fill_value='extrapolate')\n        return f(xi)\n    except Exception:\n        return np.full_like(xi, np.nan, dtype=float)\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  _compute_af_stats  (shared logic for AF and IRM acquisition stats)\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _compute_af_stats(fields, normalized):\n    \"\"\"\n    Given treatment fields and a normalized magnetisation curve, compute\n    MDF, dispersion, skewness, log-derivative etc.\n    Returns a dict of stats (added as attributes elsewhere).\n    \"\"\"\n    stats = {}\n    fields = np.asarray(fields, dtype=float)\n    normalized = np.asarray(normalized, dtype=float)\n\n    if len(fields) < 2:\n        return stats\n\n    # filter out zero / negative fields before taking log10\n    pos_mask = fields > 0\n    if np.sum(pos_mask) < 2:\n        return stats\n    fields     = fields[pos_mask]\n    normalized = normalized[pos_mask]\n\n    # log derivatives\n    dfields     = np.diff(fields)\n    dlogfields  = np.diff(np.log10(fields))\n    # guard against any remaining zero dlogfields (duplicate field values)\n    valid = dlogfields != 0\n    if np.sum(valid) < 1:\n        return stats\n    logDerivFields = np.log10(fields[:-1]) + 0.5 * dlogfields\n    with np.errstate(invalid='ignore', divide='ignore'):\n        logderiv = np.where(valid, -np.diff(normalized) / dlogfields, np.nan)\n\n    smoothSpan = max(1, int(np.floor(len(logDerivFields) * 0.03)) * 2 + 1)\n    logderivSmooth = moving(logderiv, smoothSpan)\n\n    stats['logDerivFields']  = logDerivFields\n    stats['logderiv']        = logderiv\n    stats['logderivSmooth']  = logderivSmooth\n\n    # MDF\n    try:\n        mdf = _safe_interp1(normalized[::-1], fields[::-1], 0.5)[0]\n    except Exception:\n        mdf = np.nan\n    stats['MDF'] = mdf\n\n    # mean, dispersion, skewness (log-normal moments)\n    w = logderivSmooth.copy()\n    w[w < 0] = 0\n    total = np.trapz(w, logDerivFields)\n    if total > 0 and np.isfinite(total):\n        mean_log = np.trapz(w * logDerivFields, logDerivFields) / total\n        disp = np.sqrt(np.trapz(w * (logDerivFields - mean_log) ** 2, logDerivFields) / total)\n        skew = np.trapz(w * (logDerivFields - mean_log) ** 3, logDerivFields) / (disp ** 3 * total) if disp > 0 else np.nan\n    else:\n        mean_log = disp = skew = np.nan\n\n    stats['meanlogfield'] = mean_log\n    stats['dispersion']   = disp\n    stats['skewness']     = skew\n    return stats\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgAFLevelFind\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_af_level_find(data_list, mode=None):\n    \"\"\"\n    Find the AF treatment level for each RmgData in data_list.\n    Returns a list of AF levels (in Tesla).\n    \"\"\"\n    if not isinstance(data_list, list):\n        data_list = [data_list]\n\n    af_levels = []\n    for data in data_list:\n        af_level = 1000e-4   # default 100 mT in Tesla\n        if mode == 'RRM' and len(data.stepsRRM) > 0:\n            levels = data.treatmentAFFields[data.stepsRRM]\n            af_level = levels[-1]\n        if len(data.stepsARM) > 0:\n            levels = data.treatmentAFFields[data.stepsARM]\n            af_level = levels[-1]\n        af_levels.append(af_level)\n    return af_levels\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgExtractAFOfStep\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_extract_af_of_step(data, stepnum, subtract_afmax=True):\n    \"\"\"\n    Extract the AF demagnetisation sequence following step index stepnum (0-based).\n    Returns an object with doesExist, mvector, treatmentAFFields, etc.\n    \"\"\"\n    class AF:\n        pass\n    y = AF()\n    y.experiment = 'AF'\n    y.samplename = data.samplename\n    y.mass       = data.mass\n    y.doesExist  = False\n\n    ts = y.targetStep = type('TS', (), {})()\n    ts.stepnum          = stepnum\n    ts.steptype         = data.steptypes[stepnum]\n    ts.level            = data.levels[stepnum]\n    ts.bias             = data.bias[stepnum]\n    ts.spin             = data.spin[stepnum]\n    ts.mvector          = data.mvector[:, stepnum]\n    ts.treatmentDCField = data.treatmentDCFields[stepnum]\n    ts.treatmentAFField = data.treatmentAFFields[stepnum]\n    ts.treatmentTemp    = data.treatmentTemps[stepnum]\n\n    n = len(data.levels)\n    if stepnum + 1 >= n:\n        return y\n\n    currentBlock = data.stepBlock[stepnum]   # 1-based\n\n    # Next block must be 'AF'\n    next_block_idx = int(currentBlock)       # block IDs are 1-based, list is 0-based\n    if next_block_idx >= len(data.BlockType):\n        return y\n    if data.BlockType[next_block_idx].upper() != 'AF':\n        return y\n\n    # The next step must be in the next block\n    if data.stepBlock[stepnum + 1] == currentBlock:\n        return y\n\n    # Find baseline (AFMax block adjacent to current block)\n    prev_block_idx = currentBlock - 2   # 0-based index for block (currentBlock-1)\n    next_next_idx  = currentBlock + 1   # 0-based for block (currentBlock+2)\n\n    magBaselineStep = -1\n    if prev_block_idx >= 0 and prev_block_idx < len(data.BlockType):\n        if data.BlockType[prev_block_idx].upper() == 'AFMAX':\n            steps_in_prev = np.where(data.stepBlock == (currentBlock - 1))[0]\n            if len(steps_in_prev) > 0:\n                magBaselineStep = steps_in_prev[-1]\n    if magBaselineStep < 0 and next_next_idx < len(data.BlockType):\n        if data.BlockType[next_next_idx].upper() == 'AFMAX':\n            steps_in_nn = np.where(data.stepBlock == (currentBlock + 2))[0]\n            if len(steps_in_nn) > 0:\n                magBaselineStep = steps_in_nn[0]\n\n    if magBaselineStep >= 0:\n        y.baselineVector = data.mvector[:, magBaselineStep]\n    else:\n        y.baselineVector = np.zeros(3)\n\n    y.doesExist = True\n    af_block_id = currentBlock + 1\n    y.AFSteps = np.where(data.stepBlock == af_block_id)[0]\n\n    y.mvectorUnsub = data.mvector[:, y.AFSteps]\n\n    if subtract_afmax:\n        y.mvector = y.mvectorUnsub - y.baselineVector[:, np.newaxis]\n    else:\n        y.mvector = y.mvectorUnsub.copy()\n\n    y.mmag  = np.sqrt(np.sum(y.mvector ** 2, axis=0))\n    dmv = np.diff(y.mvector, axis=1)\n    y.dmmag = np.sqrt(np.sum(dmv ** 2, axis=0))\n    c = np.cumsum(y.dmmag[::-1])\n    y.mdirectional = np.append(c[::-1], 0) + y.mmag[-1]\n\n    y.mz      = y.mvector[2, :]\n    y.mzNormalized          = y.mz / y.mz[0] if y.mz[0] != 0 else y.mz * np.nan\n    y.mmagNormalized        = y.mmag / y.mmag[0] if y.mmag[0] != 0 else y.mmag * np.nan\n    y.mdirectionalNormalized = y.mdirectional / y.mdirectional[0] if y.mdirectional[0] != 0 else y.mdirectional * np.nan\n\n    y.treatmentAFFields  = data.treatmentAFFields[y.AFSteps]\n    y.IRMDemagStepCount  = len(y.treatmentAFFields)\n\n    if y.IRMDemagStepCount > 1:\n        stats = _compute_af_stats(y.treatmentAFFields, y.mzNormalized)\n        for k, v in stats.items():\n            setattr(y, k, v)\n\n    return y\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgSIRMCurve\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_sirm_curve(data):\n    \"\"\"\n    Returns a list of SIRM curve objects for all IRM acquisition blocks.\n    \"\"\"\n    class SIRMCurve:\n        experiment = 'SIRM'\n\n    def _empty():\n        y = SIRMCurve()\n        y.doesExist = False\n        y.AF = type('AF', (), {'doesExist': False})()\n        return y\n\n    # candidate blocks: IRM/IRMz/IRMx with BlockSize > 1\n    irm_types = {'irm', 'irmz', 'irmx'}\n    candidate_blocks = [\n        bid for bid, bt in enumerate(data.BlockType, start=1)\n        if bt.lower() in irm_types and data.BlockSize[bid - 1] > 1\n    ]\n\n    if not candidate_blocks:\n        return [_empty()]\n\n    results = []\n    for bid in candidate_blocks:\n        blocksteps = np.where(data.stepBlock == bid)[0]\n        if len(blocksteps) == 0:\n            continue\n\n        y = SIRMCurve()\n        y.doesExist  = True\n        y.samplename = data.samplename\n        y.mass       = data.mass\n\n        y.AF = rmg_extract_af_of_step(data, blocksteps[-1])\n        y.baselineVector = y.AF.baselineVector if y.AF.doesExist else np.zeros(3)\n\n        y.IRM = type('IRM', (), {})()\n        y.IRM.IRMSteps         = blocksteps\n        y.IRM.treatmentDCFields = data.treatmentDCFields[blocksteps]\n        y.IRM.mvectorUnsub     = data.mvector[:, blocksteps]\n        y.IRM.mvector          = y.IRM.mvectorUnsub - y.baselineVector[:, np.newaxis]\n        y.IRM.IRMperkg         = data.mzperkg[blocksteps]\n\n        sIRM_end = y.IRM.mvector[2, -1]\n        y.IRM.fracmags = np.abs(y.IRM.mvector[2, :] / sIRM_end) if sIRM_end != 0 else np.zeros(len(blocksteps))\n        y.sIRM       = np.abs(sIRM_end)\n        y.sIRMperkg  = y.sIRM / data.mass if data.mass > 0 else np.nan\n\n        if len(blocksteps) > 1:\n            dc = y.IRM.treatmentDCFields\n            # filter zero / negative DC fields before log10\n            pos = dc > 0\n            dc_pos = dc[pos]\n            frac_pos = y.IRM.fracmags[pos]\n            dfields    = np.diff(dc)\n            y.IRM.dfields     = dfields\n            y.IRM.derivFields = dc[:-1] + 0.5 * dfields\n            if len(dc_pos) > 1:\n                dlogfields = np.diff(np.log10(dc_pos))\n                valid = dlogfields != 0\n                y.IRM.dlogfields     = dlogfields\n                y.IRM.logDerivFields = np.log10(dc_pos[:-1]) + 0.5 * dlogfields\n                with np.errstate(invalid='ignore', divide='ignore'):\n                    y.IRM.derivFracmags  = np.diff(y.IRM.fracmags[pos]) / np.diff(dc_pos)\n                    y.IRM.logderiv       = np.where(valid,\n                                                    np.diff(frac_pos) / dlogfields,\n                                                    np.nan)\n                smoothSpan = max(1, int(np.floor(len(y.IRM.logDerivFields) * 0.03)) * 2 + 1)\n                y.IRM.logderivSmooth = moving(y.IRM.logderiv, smoothSpan)\n            else:\n                y.IRM.dlogfields     = np.array([])\n                y.IRM.logDerivFields = np.array([])\n                y.IRM.derivFracmags  = np.array([])\n                y.IRM.logderiv       = np.array([])\n                y.IRM.logderivSmooth = np.array([])\n\n            # MDF, MAF, dispersion, skewness\n            try:\n                y.MAF = _safe_interp1(y.IRM.fracmags, dc, 0.5)[0]\n            except Exception:\n                y.MAF = np.nan\n\n            stats = _compute_af_stats(dc, y.IRM.fracmags)\n            y.IRM.dispersion = stats.get('dispersion', np.nan)\n            y.IRM.skewness   = stats.get('skewness', np.nan)\n            y.IRM.MDF        = stats.get('MDF', np.nan)\n\n        # Hcr, Cisowski R from backfield overlap\n        if y.AF.doesExist:\n            irm_fields  = y.IRM.treatmentDCFields\n            irm_fracs   = y.IRM.fracmags\n            af_fields   = y.AF.treatmentAFFields\n            af_fracs    = y.AF.fracmags if hasattr(y.AF, 'fracmags') else np.abs(y.AF.mzNormalized)\n\n            # Build af fracmag relative to sIRM acquisition\n            af_mz = y.AF.mvector[2, :]\n            af_fracmags = np.abs(af_mz / sIRM_end) if sIRM_end != 0 else af_mz * np.nan\n            y.AF.fracmags = af_fracmags\n\n            try:\n                y.Hcr = _safe_interp1(af_fracmags, af_fields, 0.5)[0]\n            except Exception:\n                y.Hcr = np.nan\n\n            # Cisowski R: fraction of IRM fields where IRM_acq > IRM_AF (normalized to same max)\n            try:\n                common_fields = np.sort(np.unique(np.concatenate([irm_fields, af_fields])))\n                irm_interp = _safe_interp1(irm_fields, irm_fracs, common_fields)\n                af_interp  = _safe_interp1(af_fields,  af_fracmags, common_fields)\n                y.R = float(np.sum(irm_interp < af_interp)) / len(common_fields)\n            except Exception:\n                y.R = np.nan\n\n            # MDF of AF demagnetisation\n            if y.AF.IRMDemagStepCount > 1:\n                af_stats = _compute_af_stats(af_fields, af_fracmags)\n                y.MDF        = af_stats.get('MDF', np.nan)\n                y.AF.dispersion = af_stats.get('dispersion', np.nan)\n                y.AF.skewness   = af_stats.get('skewness', np.nan)\n                y.AF.logDerivFields = af_stats.get('logDerivFields', np.array([]))\n                y.AF.logderiv       = af_stats.get('logderiv', np.array([]))\n                y.AF.logderivSmooth = af_stats.get('logderivSmooth', np.array([]))\n            else:\n                y.MDF = np.nan\n\n            # Integrated fractional IRM acq \u2013 AF\n            try:\n                common_f = np.sort(np.unique(np.concatenate([irm_fields, af_fields])))\n                irm_i = _safe_interp1(irm_fields, irm_fracs, common_f)\n                af_i  = _safe_interp1(af_fields,  af_fracmags, common_f)\n                y.diff = type('D', (), {})()\n                y.diff.integrateddelta = np.trapz(irm_i - af_i, common_f)\n            except Exception:\n                y.diff = type('D', (), {'integrateddelta': np.nan})()\n\n        # IRM30/IRM100, IRM100/IRM300\n        dc = y.IRM.treatmentDCFields\n        fracs = y.IRM.fracmags\n        try:\n            irm30  = _safe_interp1(dc, fracs, 30e-3)[0]\n            irm100 = _safe_interp1(dc, fracs, 100e-3)[0]\n            irm300 = _safe_interp1(dc, fracs, 300e-3)[0]\n            y.IRM30toIRM100  = irm30 / irm100 if irm100 != 0 else np.nan\n            y.IRM100toIRM300 = irm100 / irm300 if irm300 != 0 else np.nan\n            y.IRM.logderiv  # ensure exists\n            y.dfIRMdBatField = dc[-1] * 1000\n            y.dfIRMdB        = y.IRM.logderiv[-1]\n        except Exception:\n            y.IRM30toIRM100  = np.nan\n            y.IRM100toIRM300 = np.nan\n\n        results.append(y)\n\n    return results if results else [_empty()]\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgARMCurve\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _corresponding_irm(data, irm_level):\n    \"\"\"Find the IRM mvector at a given DC field level.\"\"\"\n    irm_types = {'irm', 'irmz', 'irmx'}\n    all_irm_steps = [i for i, s in enumerate(data.steptypes) if s.lower() in irm_types]\n    if not all_irm_steps:\n        return np.array([np.nan, np.nan, np.nan])\n\n    all_irm_steps = np.array(all_irm_steps)\n    exact = all_irm_steps[np.where(data.treatmentDCFields[all_irm_steps] == irm_level)[0]]\n    if len(exact) > 0:\n        return data.mvector[:, exact[-1]]\n\n    # Interpolate\n    fd = data.treatmentDCFields[all_irm_steps] - irm_level\n    sign_changes = np.where(fd[:-1] * fd[1:] < 0)[0]\n    if len(sign_changes) == 0:\n        return np.array([np.nan, np.nan, np.nan])\n\n    idx = sign_changes[0]\n    s0, s1 = all_irm_steps[idx], all_irm_steps[idx + 1]\n    x0, x1 = np.log10(data.treatmentDCFields[s0]), np.log10(data.treatmentDCFields[s1])\n    xi = np.log10(irm_level)\n    result = np.zeros(3)\n    for row in range(3):\n        result[row] = np.interp(xi, [x0, x1], [data.mvector[row, s0], data.mvector[row, s1]])\n    return result\n\n\ndef rmg_arm_curve(data):\n    \"\"\"Returns a list of ARM curve objects.\"\"\"\n    class ARMCurve:\n        experiment = 'ARM'\n\n    def _empty():\n        y = ARMCurve()\n        y.doesExist = False\n        return y\n\n    # ARM blocks followed immediately by AF block\n    candidate_blocks = []\n    for bid in range(1, len(data.BlockType)):\n        if (data.BlockType[bid - 1].upper() == 'ARM' and\n                bid < len(data.BlockType) and\n                data.BlockType[bid].upper() == 'AF'):\n            candidate_blocks.append(bid)   # 1-based block id\n\n    if not candidate_blocks:\n        return [_empty()]\n\n    results = []\n    for bid in candidate_blocks:\n        blocksteps = np.where(data.stepBlock == bid)[0]\n        if len(blocksteps) == 0:\n            continue\n\n        y = ARMCurve()\n        y.doesExist   = True\n        y.samplename  = data.samplename\n        y.mass        = data.mass\n\n        y.ARMsteps          = blocksteps\n        y.bias              = data.bias[blocksteps]\n        y.treatmentDCFields = data.treatmentDCFields[blocksteps]\n        y.treatmentAFFields = data.treatmentAFFields[blocksteps]\n        y.mvectorUnsub      = data.mvector[:, blocksteps]\n        y.mvector           = y.mvectorUnsub - y.mvectorUnsub[:, 0:1]  # subtract first step\n\n        denom = y.mvector[2, :]\n        dc100 = interp1d(y.treatmentDCFields, np.abs(y.mvector[2, :]),\n                         bounds_error=False, fill_value='extrapolate')(1e-4)\n        y.ARMsusceptibility = dc100 / (1e-4 / MU0)\n\n        unique_af = np.unique(y.treatmentAFFields)\n        af_level = unique_af[0] if len(unique_af) == 1 else np.nan\n\n        if np.isfinite(af_level):\n            irm_mv = _corresponding_irm(data, af_level)\n            y.mvectorIRM = irm_mv - y.mvectorUnsub[:, 0]\n            irm_mz = y.mvectorIRM[2]\n        else:\n            irm_mz = np.nan\n\n        if np.isfinite(irm_mz) and irm_mz != 0:\n            y.fracmags = np.abs(y.mvector[2, :] / irm_mz)\n            y.ARMsusceptibilityToIRM = y.ARMsusceptibility / np.abs(irm_mz)\n            y.ARMtoIRMat100uT  = y.ARMsusceptibilityToIRM * (1e-4 / MU0)\n            y.ARMtoIRMat500uT  = float(interp1d(\n                y.treatmentDCFields, np.abs(y.mvector[2, :]),\n                bounds_error=False, fill_value='extrapolate')(5e-4)) / np.abs(irm_mz)\n            y.ARMtoIRMat500uTDeviationfromTanh = (\n                y.ARMtoIRMat500uT - np.tanh((5e-4 / MU0) * y.ARMsusceptibilityToIRM))\n        else:\n            # no matching IRM \u2014 plot raw ARM Mz normalised to its own maximum\n            mz_abs = np.abs(y.mvector[2, :])\n            mz_max = mz_abs[-1] if mz_abs[-1] != 0 else (np.max(mz_abs) if np.max(mz_abs) > 0 else 1.0)\n            y.fracmags = mz_abs / mz_max\n            y.mvectorIRM = np.array([np.nan, np.nan, np.nan])\n            y.ARMsusceptibilityToIRM = np.nan\n            y.ARMtoIRMat100uT = np.nan\n            y.ARMtoIRMat500uT = np.nan\n            y.ARMtoIRMat500uTDeviationfromTanh = np.nan\n\n        dfields = np.diff(y.treatmentDCFields)\n        y.derivfields   = y.treatmentDCFields[:-1] + 0.5 * dfields\n        with np.errstate(invalid='ignore', divide='ignore'):\n            y.fracmagsderiv = np.diff(y.fracmags) / dfields\n\n        results.append(y)\n\n    return results if results else [_empty()]\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgIRMBackfieldCurve\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_irm_backfield_curve(data):\n    \"\"\"Returns a list of IRM backfield curve objects.\"\"\"\n    class BackfieldCurve:\n        experiment = 'IRMBackfield'\n\n    def _empty():\n        y = BackfieldCurve()\n        y.doesExist = False\n        y.samplename = data.samplename\n        return y\n\n    irm_sequences = rmg_sirm_curve(data)\n    if not any(s.doesExist for s in irm_sequences):\n        return [_empty()]\n\n    # Find sign changes in DC field within each sequence\n    candidates = {}\n    for i, seq in enumerate(irm_sequences):\n        if not seq.doesExist:\n            continue\n        dc = seq.IRM.treatmentDCFields\n        dsign = np.diff(np.sign(dc))\n        cands = np.where(np.abs(dsign) == 2)[0] + 1  # step AFTER sign change\n        if len(cands) > 0:\n            candidates[i] = cands\n\n    if not candidates:\n        return [_empty()]\n\n    results = []\n    for i, cand_idxs in candidates.items():\n        seq = irm_sequences[i]\n        for ci in cand_idxs:\n            # These are positions within the IRM block; map to global step\n            global_step = seq.IRM.IRMSteps[ci]\n            demag = _extract_dc_demag(data, global_step)\n            if demag.doesExist:\n                obj = BackfieldCurve()\n                obj.doesExist  = True\n                obj.samplename = data.samplename\n                obj.Demag      = demag\n                results.append(obj)\n\n    return results if results else [_empty()]\n\n\ndef _extract_dc_demag(data, stepnum):\n    \"\"\"Extract DC demagnetisation steps following a given step.\"\"\"\n    class Demag:\n        pass\n    y = Demag()\n    y.samplename = data.samplename\n    y.mass       = data.mass\n    y.doesExist  = False\n\n    n = len(data.levels)\n    if stepnum + 1 >= n:\n        return y\n\n    ts = type('TS', (), {})()\n    ts.stepnum          = stepnum\n    ts.steptype         = data.steptypes[stepnum]\n    ts.level            = data.levels[stepnum]\n    ts.bias             = data.bias[stepnum]\n    ts.spin             = data.spin[stepnum]\n    ts.mvector          = data.mvector[:, stepnum]\n    ts.treatmentDCField = data.treatmentDCFields[stepnum]\n    ts.treatmentTemp    = data.treatmentTemps[stepnum]\n    y.targetStep = ts\n\n    irm_types = {'irm', 'irmz', 'irmx'}\n    next_type = data.steptypes[stepnum + 1].lower()\n    if next_type not in irm_types:\n        return y\n\n    currentBlock = data.stepBlock[stepnum]\n    demagBlock   = data.stepBlock[stepnum + 1]\n\n    # Find baseline from adjacent AFMax block\n    magBaselineStep = -1\n    prev_bi = currentBlock - 2\n    nnxt_bi = demagBlock\n    if prev_bi >= 0 and data.BlockType[prev_bi].upper() == 'AFMAX':\n        steps_prev = np.where(data.stepBlock == (currentBlock - 1))[0]\n        if len(steps_prev) > 0:\n            magBaselineStep = steps_prev[-1]\n    elif nnxt_bi < len(data.BlockType) and data.BlockType[nnxt_bi].upper() == 'AFMAX':\n        steps_nn = np.where(data.stepBlock == (demagBlock + 1))[0]\n        if len(steps_nn) > 0:\n            magBaselineStep = steps_nn[0]\n\n    if magBaselineStep >= 0:\n        y.baselineVector = data.mvector[:, magBaselineStep]\n    else:\n        y.baselineVector = np.zeros(3)\n\n    y.doesExist  = True\n    demag_steps  = np.intersect1d(\n        np.where(data.stepBlock == demagBlock)[0],\n        np.arange(stepnum, n)\n    )\n    y.DemagSteps  = demag_steps\n    y.mvectorUnsub = data.mvector[:, demag_steps]\n    y.mvector      = y.mvectorUnsub - y.baselineVector[:, np.newaxis]\n    y.treatmentDCFields = data.treatmentDCFields[demag_steps]\n    y.mass = data.mass\n    return y\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgRRMCurve\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_rrm_curve(data):\n    \"\"\"Returns a list of RRM curve objects.\"\"\"\n    class RRMCurve:\n        experiment = 'RRM'\n\n    def _empty():\n        y = RRMCurve()\n        y.doesExist = False\n        return y\n\n    candidate_blocks = [bid for bid, bt in enumerate(data.BlockType, start=1)\n                        if bt.upper() == 'RRM']\n    if not candidate_blocks:\n        return [_empty()]\n\n    # ARM info for susceptibility\n    arm_curves = rmg_arm_curve(data)\n    arm_fields = []\n    for arm in arm_curves:\n        if arm.doesExist:\n            uq = np.unique(arm.treatmentAFFields)\n            arm_fields.append(uq[0] if len(uq) == 1 else np.nan)\n        else:\n            arm_fields.append(np.nan)\n\n    results = []\n    for bid in candidate_blocks:\n        blocksteps = np.where(data.stepBlock == bid)[0]\n        if len(blocksteps) == 0:\n            continue\n\n        y = RRMCurve()\n        y.doesExist  = True\n        y.samplename = data.samplename\n        y.mass       = data.mass\n        y.RRMsteps   = blocksteps\n        y.spins      = data.spin[blocksteps]\n\n        # baseline at spin=0 step\n        zero_idx = np.where(y.spins == 0)[0]\n        if len(zero_idx) == 0:\n            y.doesExist = False\n            continue\n        y.baselineVector = data.mvector[:, blocksteps[zero_idx[0]]]\n        y.deltas = data.mvector[:, blocksteps] - y.baselineVector[:, np.newaxis]\n\n        # Find matching ARM\n        target_af = data.treatmentAFFields[blocksteps[0]]\n        arm_susc = np.nan\n        for j, af in enumerate(arm_fields):\n            if np.isclose(af, target_af, rtol=1e-6):\n                arm_susc = arm_curves[j].ARMsusceptibility\n                break\n\n        y.ARMsusceptibility = arm_susc\n        if arm_susc != 0 and np.isfinite(arm_susc):\n            y.Brrm = MU0 * y.deltas[2, :] / arm_susc\n        else:\n            y.Brrm = np.full(len(blocksteps), np.nan)\n\n        results.append(y)\n\n    return results if results else [_empty()]\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgLowrieFullerCurves\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_lowrie_fuller_curves(data):\n    \"\"\"Returns a list of Lowrie-Fuller curve objects.\"\"\"\n    class LFCurve:\n        experiment = 'Lowrie-Fuller'\n\n    def _empty():\n        y = LFCurve()\n        y.doesExist = False\n        return y\n\n    irm_types = {'irm', 'irmz', 'irmx'}\n\n    # Candidate ARM blocks: ARM followed by AF\n    cand_arm = [bid for bid in range(1, len(data.BlockType))\n                if data.BlockType[bid - 1].upper() == 'ARM'\n                and data.BlockType[bid].upper() == 'AF']\n\n    # Candidate IRM blocks: IRM followed by AF\n    cand_irm = [bid for bid in range(1, len(data.BlockType))\n                if data.BlockType[bid - 1].lower() in irm_types\n                and data.BlockType[bid].upper() == 'AF']\n\n    if not cand_arm or not cand_irm:\n        return [_empty()]\n\n    # IRM levels\n    irm_steps_list = {}\n    irm_levels     = {}\n    for bid in cand_irm:\n        steps = np.where(data.stepBlock == bid)[0]\n        if len(steps) > 0:\n            irm_steps_list[bid] = steps\n            irm_levels[bid]     = abs(data.treatmentDCFields[steps[-1]])\n\n    # ARM levels & match to IRM\n    results = []\n    for arm_bid in cand_arm:\n        arm_steps = np.where(data.stepBlock == arm_bid)[0]\n        if len(arm_steps) == 0:\n            continue\n        arm_af_level = data.treatmentAFFields[arm_steps[-1]]\n\n        # Find matching IRM block (IRM level == ARM AF level)\n        match_irm = None\n        for irm_bid, irm_lev in irm_levels.items():\n            if np.isclose(irm_lev, arm_af_level, rtol=1e-6):\n                match_irm = irm_bid\n                break\n        if match_irm is None:\n            continue\n\n        y = LFCurve()\n        y.doesExist = True\n        y.ARMAF  = rmg_extract_af_of_step(data, arm_steps[-1])\n        y.IRMAF  = rmg_extract_af_of_step(data, irm_steps_list[match_irm][-1])\n\n        if y.ARMAF.doesExist and y.IRMAF.doesExist:\n            arm_mdf = getattr(y.ARMAF, 'MDF', np.nan)\n            irm_mdf = getattr(y.IRMAF, 'MDF', np.nan)\n            y.deltaMDF = arm_mdf - irm_mdf\n        else:\n            y.deltaMDF = np.nan\n\n        results.append(y)\n\n    return results if results else [_empty()]\n\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#  RmgFullerCurves\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef rmg_fuller_curves(data):\n    \"\"\"Returns a Fuller Curves object.\"\"\"\n    class FullerCurve:\n        experiment = 'Fuller'\n\n    y = FullerCurve()\n    y.doesExist = False\n\n    irm_types = {'irm', 'irmz', 'irmx'}\n\n    # NRM blocks followed by AF\n    cand_nrm = [bid for bid in range(1, len(data.BlockType))\n                if data.BlockType[bid - 1].upper() == 'NRM'\n                and data.BlockType[bid].upper() == 'AF']\n    if not cand_nrm:\n        return y\n\n    nrm_steps = np.where(data.stepBlock == cand_nrm[0])[0]\n    y.NRM = rmg_extract_af_of_step(data, nrm_steps[-1])\n\n    # IRM blocks followed by AF\n    cand_irm = [bid for bid in range(1, len(data.BlockType))\n                if data.BlockType[bid - 1].lower() in irm_types\n                and data.BlockType[bid].upper() == 'AF']\n    if not cand_irm:\n        return y\n\n    irm_steps = np.where(data.stepBlock == cand_irm[-1])[0]\n    y.IRM = rmg_extract_af_of_step(data, irm_steps[-1])\n\n    if not y.IRM.doesExist:\n        return y\n\n    y.doesExist   = True\n    y.trialFields = y.IRM.treatmentAFFields\n    y.calcIRM     = y.IRM.mmag\n\n    if y.NRM.doesExist:\n        y.calcNRM = np.abs(_safe_interp1(y.NRM.treatmentAFFields, y.NRM.mmag, y.trialFields))\n        y.NRMtoIRM = y.calcNRM[0] / y.calcIRM[0] if y.calcIRM[0] != 0 else np.nan\n    else:\n        y.calcNRM  = np.zeros_like(y.trialFields)\n        y.NRMtoIRM = np.nan\n\n    # ARM blocks followed by AF\n    cand_arm = [bid for bid in range(1, len(data.BlockType))\n                if data.BlockType[bid - 1].upper() == 'ARM'\n                and data.BlockType[bid].upper() == 'AF']\n\n    y.ARM     = []\n    y.calcARM = []\n    for arm_bid in cand_arm:\n        arm_steps = np.where(data.stepBlock == arm_bid)[0]\n        if len(arm_steps) > 0:\n            arm_af = rmg_extract_af_of_step(data, arm_steps[-1])\n            y.ARM.append(arm_af)\n            if arm_af.doesExist:\n                interped = np.abs(_safe_interp1(arm_af.treatmentAFFields, arm_af.mmag, y.trialFields))\n                y.calcARM.append(interped)\n            else:\n                y.calcARM.append(np.zeros_like(y.trialFields))\n\n    if y.calcARM:\n        y.calcARM = np.array(y.calcARM)\n        y.ARMtoIRM = (y.calcARM[:, 0] / y.calcIRM[0]\n                      if y.calcIRM[0] != 0 else np.full(len(y.ARM), np.nan))\n    else:\n        y.calcARM  = np.zeros((0, len(y.trialFields)))\n        y.ARMtoIRM = np.array([])\n\n    return y\n\n\n# =============================================================================\n#  NEW: rmg_arm_curve_subtract  (RmgARMCurveSubtract.m)\n#  NEW: rmg_fractional_arm      (RmgFractionalARM.m)\n# =============================================================================\n\ndef rmg_arm_curve_subtract(curve1, curve2, weights=None):\n    \"\"\"\n    Subtract two ARM acquisition curves (weighted difference).\n\n    Port of RmgARMCurveSubtract.m (Kopp 2008).\n\n    Useful for isolating a magnetic component by differencing two ARM\n    curves acquired at different AF levels.\n\n    Parameters\n    ----------\n    curve1 : ARM curve object from rmg_arm_curve()\n    curve2 : ARM curve object from rmg_arm_curve()\n    weights : tuple (w1, w2), optional \u2014 default (1, 1)\n\n    Returns\n    -------\n    dict with doesExist, treatmentDCFields, Mz1, Mz2, Mz, mvectorIRM,\n         fracmags, derivfields, fracmagsderiv,\n         ARMsusceptibility, ARMsusceptibilityToIRM, ARMtoIRMat100uT\n    \"\"\"\n    from scipy.interpolate import interp1d as _interp1d\n\n    w1, w2 = (1.0, 1.0) if weights is None else (float(weights[0]), float(weights[1]))\n\n    fields1 = np.asarray(curve1.treatmentDCFields, dtype=float)\n    fields2 = np.asarray(curve2.treatmentDCFields, dtype=float)\n    common_dc = np.intersect1d(fields1, fields2)\n\n    if len(common_dc) == 0:\n        return {'doesExist': False}\n\n    mz1_raw = curve1.mvector[2, :]\n    mz2_raw = curve2.mvector[2, :]\n\n    Mz1 = _interp1d(fields1, mz1_raw, bounds_error=False, fill_value='extrapolate')(common_dc) * w1\n    Mz2 = _interp1d(fields2, mz2_raw, bounds_error=False, fill_value='extrapolate')(common_dc) * w2\n    Mz  = Mz1 - Mz2\n\n    mvIRM1 = np.asarray(curve1.mvectorIRM, dtype=float) * w1\n    mvIRM2 = np.asarray(curve2.mvectorIRM, dtype=float) * w2\n    mvIRM  = mvIRM1 - mvIRM2\n    irm_z  = mvIRM[2]\n\n    fracmags = np.abs(Mz / irm_z) if irm_z != 0 else np.full_like(Mz, np.nan)\n\n    dfields = np.diff(common_dc)\n    deriv_fields   = common_dc[:-1] + 0.5 * dfields\n    fracmags_deriv = np.diff(fracmags) / dfields\n\n    ref_field = 1e-4  # T (0.1 mT)\n    mz_at_ref = float(_interp1d(common_dc, np.abs(Mz),\n                                bounds_error=False, fill_value='extrapolate')(ref_field))\n    arm_susc         = mz_at_ref / (ref_field / MU0)\n    arm_susc_to_irm  = arm_susc / abs(irm_z) if irm_z != 0 else np.nan\n    arm_to_irm_100   = arm_susc_to_irm * (ref_field / MU0)\n\n    return {\n        'doesExist':              True,\n        'treatmentDCFields':      common_dc,\n        'treatmentACField1':      getattr(curve1, 'treatmentACField',\n                                          curve1.treatmentAFFields[0] if len(curve1.treatmentAFFields) else np.nan),\n        'treatmentACField2':      getattr(curve2, 'treatmentACField',\n                                          curve2.treatmentAFFields[0] if len(curve2.treatmentAFFields) else np.nan),\n        'mvectorIRM1':            mvIRM1,\n        'mvectorIRM2':            mvIRM2,\n        'Mz1':                    Mz1,\n        'Mz2':                    Mz2,\n        'Mz':                     Mz,\n        'mvectorIRM':             mvIRM,\n        'fracmags':               fracmags,\n        'derivfields':            deriv_fields,\n        'fracmagsderiv':          fracmags_deriv,\n        'ARMsusceptibility':      arm_susc,\n        'ARMsusceptibilityToIRM': arm_susc_to_irm,\n        'ARMtoIRMat100uT':        arm_to_irm_100,\n    }\n\n\ndef rmg_fractional_arm(data, af_level=None):\n    \"\"\"\n    Extract the fractional ARM acquisition curve at a given AF level.\n\n    Port of RmgFractionalARM.m (Kopp 2008).\n\n    Parameters\n    ----------\n    data     : RmgData object\n    af_level : float (T), optional \u2014 defaults to rmg_af_level_find()\n\n    Returns\n    -------\n    dict with doesExist, bias, treatmentDCField, treatmentACField,\n              mvectorUnsub, mvector, mvectorIRM, fracmags\n    \"\"\"\n    if af_level is None:\n        af_level = rmg_af_level_find([data])[0]\n\n    arm_steps = np.asarray(data.stepsARM, dtype=int)\n    af_fields = np.asarray(data.treatmentAFFields, dtype=float)\n    dc_fields = np.asarray(data.treatmentDCFields, dtype=float)\n\n    at_af   = arm_steps[np.isclose(af_fields[arm_steps], af_level, rtol=1e-4)]\n    zero_dc = at_af[np.isclose(dc_fields[at_af], 0.0, atol=1e-9)]\n\n    if len(zero_dc) == 0:\n        return {'doesExist': False}\n\n    stepnum = zero_dc[-1]\n\n    all_steps      = np.arange(stepnum + 1, len(data.levels))\n    subsequent_arm = np.intersect1d(all_steps, arm_steps)\n    subsequent_non = np.setdiff1d(all_steps, arm_steps)\n\n    if len(subsequent_non) == 0:\n        arm_range = subsequent_arm\n    else:\n        first_non = subsequent_non[0]\n        arm_range = (np.arange(subsequent_arm[0], first_non)\n                     if len(subsequent_arm) > 0 else np.array([], dtype=int))\n\n    if len(arm_range) == 0:\n        return {'doesExist': False}\n\n    irm_types = {'irm', 'irmz', 'irmx'}\n    steps_irm    = np.array([i for i, s in enumerate(data.steptypes) if s.lower() in irm_types])\n    at_irm_level = steps_irm[np.isclose(dc_fields[steps_irm], af_level, rtol=1e-4)]\n\n    if len(at_irm_level) == 0:\n        return {'doesExist': False}\n\n    stepnum_irm = at_irm_level[-1]\n    mvectors    = np.asarray(data.mvector, dtype=float)\n\n    mv_unsub = mvectors[:, arm_range]\n    baseline = mv_unsub[:, 0:1]\n    mv       = mv_unsub - baseline\n    mv_irm   = mvectors[:, stepnum_irm] - baseline[:, 0]\n\n    irm_z    = mv_irm[2]\n    fracmags = (np.abs(mv[2, :] / irm_z)\n                if irm_z != 0 else np.full(mv.shape[1], np.nan))\n\n    return {\n        'doesExist':        True,\n        'bias':             np.asarray(data.bias[arm_range], dtype=float),\n        'treatmentDCField': dc_fields[arm_range],\n        'treatmentACField': float(af_level),\n        'mvectorUnsub':     mv_unsub,\n        'mvector':          mv,\n        'mvectorIRM':       mv_irm,\n        'fracmags':         fracmags,\n    }\n";
PY['rmg_stats'] = "\"\"\"\nrmg_stats.py\n------------\nPython translation of RmgStats.m by Robert E. Kopp (2008).\nComputes rock-magnetic statistics from an RmgData object.\n\nCopyright (C) 2008 Robert E. Kopp (original MATLAB code), GNU GPL v.3\nPython port 2025.\n\"\"\"\n\nimport numpy as np\nfrom rmg_curves import (\n    rmg_fuller_curves,\n    rmg_lowrie_fuller_curves,\n    rmg_sirm_curve,\n    rmg_rrm_curve,\n    rmg_arm_curve,\n    rmg_irm_backfield_curve,\n)\n\n\ndef rmg_stats(data_list):\n    \"\"\"\n    Compute rock-magnetic statistics for a list of RmgData objects.\n\n    Parameters\n    ----------\n    data_list : list of RmgData  (or single RmgData)\n\n    Returns\n    -------\n    list of dicts, one per sample\n    \"\"\"\n    if not isinstance(data_list, list):\n        data_list = [data_list]\n\n    units = {\n        'susceptibility':           'Am\u00b2/T',\n        'sIRM':                     'Am\u00b2',\n        'sIRMperkg':                'Am\u00b2/kg',\n        'Hcr':                      'mT',\n        'MDF':                      'mT',\n        'ARMsusceptibility':        'Am\u00b2/T',\n        'ARMsusceptibilityToIRM':   '1/T',\n    }\n\n    results = []\n    for data in data_list:\n        s = {'sample': data.samplename, 'units': units}\n\n        # Susceptibility (last positive value)\n        if hasattr(data, 'suscep') and len(data.suscep) > 0:\n            pos = np.where(data.suscep > 0)[0]\n            s['susceptibility'] = float(data.suscep[pos[-1]]) if len(pos) > 0 else np.nan\n        else:\n            s['susceptibility'] = np.nan\n\n        # \u2500\u2500 Lowrie-Fuller curves \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        lf_curves = rmg_lowrie_fuller_curves(data)\n        lf = lf_curves[-1] if any(c.doesExist for c in lf_curves) else None\n\n        if lf is not None and lf.doesExist:\n            arm_af = lf.ARMAF\n            irm_af = lf.IRMAF\n            s['MDFofARM']        = getattr(arm_af, 'MDF', np.nan) * 1e3\n            s['MDFofIRMatARM']   = getattr(irm_af, 'MDF', np.nan) * 1e3\n            s['DPofARM']         = getattr(arm_af, 'dispersion', np.nan)\n            s['DPofIRMatARM']    = getattr(irm_af, 'dispersion', np.nan)\n            s['SkewnessofARM']   = getattr(arm_af, 'skewness', np.nan)\n            s['SkewnessofIRMatARM'] = getattr(irm_af, 'skewness', np.nan)\n        else:\n            for k in ('MDFofARM', 'MDFofIRMatARM', 'DPofARM', 'DPofIRMatARM',\n                      'SkewnessofARM', 'SkewnessofIRMatARM'):\n                s[k] = np.nan\n\n        # \u2500\u2500 SIRM curve \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        sirm_curves = rmg_sirm_curve(data)\n        # prefer one that has an AF demagnetisation\n        best_sirm = sirm_curves[-1] if sirm_curves else None\n        for c in sirm_curves:\n            if c.doesExist and c.AF.doesExist:\n                best_sirm = c\n                break\n\n        if best_sirm is not None and best_sirm.doesExist:\n            sc = best_sirm\n            s['sIRM']       = sc.sIRM\n            s['sIRMperkg']  = sc.sIRMperkg\n            s['dfIRMdBatField'] = getattr(sc, 'dfIRMdBatField', np.nan)\n            s['dfIRMdB']    = getattr(sc, 'dfIRMdB', np.nan)\n            s['IRM30toIRM100']  = getattr(sc, 'IRM30toIRM100', np.nan)\n            s['IRM100toIRM300'] = getattr(sc, 'IRM100toIRM300', np.nan)\n            s['MAFofIRM']   = getattr(sc, 'MAF', np.nan) * 1e3\n            s['DPofIRMAcq'] = getattr(sc.IRM, 'dispersion', np.nan)\n\n            if sc.AF.doesExist:\n                s['Hcr']                = getattr(sc, 'Hcr', np.nan) * 1e3\n                s['CisowskiR']          = getattr(sc, 'R', np.nan)\n                s['SkewnessofIRMAcq']   = getattr(sc.IRM, 'skewness', np.nan)\n                s['IntegratedIRMMinusAF'] = getattr(sc.diff, 'integrateddelta', np.nan)\n                s['MDFofIRM']           = getattr(sc, 'MDF', np.nan) * 1e3\n                s['SkewnessofIRMAF']    = getattr(sc.AF, 'skewness', np.nan)\n                s['DPofIRMAF']          = getattr(sc.AF, 'dispersion', np.nan)\n            else:\n                for k in ('Hcr', 'CisowskiR', 'SkewnessofIRMAcq',\n                          'IntegratedIRMMinusAF', 'MDFofIRM',\n                          'SkewnessofIRMAF', 'DPofIRMAF'):\n                    s[k] = np.nan\n        else:\n            for k in ('sIRM', 'sIRMperkg', 'Hcr', 'CisowskiR',\n                      'IRM30toIRM100', 'IRM100toIRM300', 'IntegratedIRMMinusAF',\n                      'MAFofIRM', 'MDFofIRM', 'dfIRMdBatField', 'dfIRMdB',\n                      'DPofIRMAcq', 'DPofIRMAF', 'SkewnessofIRMAcq',\n                      'SkewnessofIRMAF'):\n                s[k] = np.nan\n\n        # \u2500\u2500 ARM curve \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        arm_curves = rmg_arm_curve(data)\n        arm = next((c for c in arm_curves if c.doesExist), None)\n\n        if arm is not None:\n            s['ARMsusceptibility']      = getattr(arm, 'ARMsusceptibility', np.nan)\n            s['ARMsusceptibilityToIRM'] = getattr(arm, 'ARMsusceptibilityToIRM', np.nan)\n            s['ARMtoIRMat100uT']        = getattr(arm, 'ARMtoIRMat100uT', np.nan)\n            s['ARMtoIRMat500uT']        = getattr(arm, 'ARMtoIRMat500uT', np.nan)\n            s['ARMtoIRMat500uTDeviationfromTanh'] = getattr(\n                arm, 'ARMtoIRMat500uTDeviationfromTanh', np.nan)\n        else:\n            for k in ('ARMsusceptibility', 'ARMsusceptibilityToIRM',\n                      'ARMtoIRMat100uT', 'ARMtoIRMat500uT',\n                      'ARMtoIRMat500uTDeviationfromTanh'):\n                s[k] = np.nan\n\n        # NRM\n        s['NRM'] = np.nan\n        s['NRMdirectional'] = np.nan\n        s['MDFofNRM'] = np.nan\n\n        results.append(s)\n\n    return results\n";
